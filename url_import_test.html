<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公式URL取り込み検証</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:720px;margin:auto;background:#fff2f9;color:#74395b;padding:22px;line-height:1.65}main{background:white;border:2px solid #efc7df;border-radius:20px;padding:18px}input,button{box-sizing:border-box;width:100%;border-radius:12px;padding:13px;font-size:16px}input{border:1px solid #d6aec8}button{border:0;background:#df69aa;color:white;margin-top:12px;font-weight:700}pre{white-space:pre-wrap;word-break:break-all;background:#faf4f8;padding:12px;border-radius:10px;font-size:12px}img{width:110px;height:110px;object-fit:contain}article{display:flex;align-items:center;gap:12px;border-bottom:1px solid #ecdce4;padding:9px 0}small{color:#84667a}a{color:#ae3f83}</style></head><body><main><h2>公式URL取り込みテスト</h2><p>Safariのブラウザから公式ページのHTMLが直接取得できるか調べます。実際のプリコレッタのデータは変更しません。</p><input id="url" value="https://aipri.jp/verse/item/oa4.html" aria-label="公式ページURL"><button id="go">URLから読み取る</button><p id="status" role="status">未実行</p><div id="results"></div><pre id="details"></pre><p><small>※ 画像は公式サイトへの直接参照のみ。ブラウザのCORS制限や画像のアクセス制限によっては表示できません。取得内容は保存・送信しません。</small></p></main><script>
const $=id=>document.getElementById(id);const say=(s)=>$('status').textContent=s;
$('go').onclick=async()=>{ $('results').replaceChildren();$('details').textContent='';let u;try{u=new URL($('url').value);if(u.protocol!=='https:'||u.hostname!=='aipri.jp')throw Error('aipri.jp のHTTPS URLを指定してください');}catch(e){say(e.message);return}say('取得中…');try{const r=await fetch(u.href,{mode:'cors',credentials:'omit',redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);const h=await r.text();const d=new DOMParser().parseFromString(h,'text/html');const ims=[...d.querySelectorAll('img')].map(x=>({alt:x.getAttribute('alt')||'',src:x.getAttribute('data-src')||x.getAttribute('src')||''})).filter(x=>x.src);const item=ims.filter(x=>/thumb|Item_ID/i.test(x.src));say('HTML取得成功！画像要素 '+ims.length+'件（thumb/Item_IDに一致 '+item.length+'件）');$('details').textContent='ページタイトル: '+d.title+'\nHTML文字数: '+h.length+'\n先頭10件の画像URL:\n'+ims.slice(0,10).map(x=>x.alt+' : '+new URL(x.src,u.href).href).join('\n');for(const x of item.slice(0,12)){const a=document.createElement('article'),im=document.createElement('img'),t=document.createElement('div');im.src=new URL(x.src,u.href).href;im.loading='lazy';t.textContent=x.alt||x.src.split('/').pop();a.append(im,t);$('results').append(a)}}catch(e){say('URLからの直接取得に失敗しました');$('details').textContent=e.name+': '+e.message+'\n\nこのエラーはCORS制限・ネットワーク障害・アクセス制御等で起こります。CORSかどうかの確定には開発者ツールやサーバーヘッダーの確認が必要です。';}};
</script></body></html>

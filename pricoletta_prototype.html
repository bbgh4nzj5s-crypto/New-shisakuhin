<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pricoletta｜コーデアイテム試作</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#895678;background:#fff2f9}*{box-sizing:border-box}body{margin:0}.app{height:100dvh;max-width:560px;margin:auto;display:flex;flex-direction:column;background:#fff6fb}.head{padding:12px 14px 8px;background:#ffe5f3;border-bottom:2px solid #e9b3d1;text-align:center;color:#ae548a;font-weight:900;letter-spacing:.05em}.nav{display:flex;gap:8px;padding:10px 12px 4px}.btn,.tab{border:1.5px solid #e8b2d1;background:white;color:#a45c88;border-radius:12px;padding:8px 11px;font-weight:700;cursor:pointer}.tab{flex:1}.active,.pink{background:#ed77b4;color:white;border-color:#d65b9a;box-shadow:inset 0 0 0 2px #ffd6e9,0 3px 0 #c65c93}.tools{padding:8px 12px;display:grid;gap:8px}.search{width:100%;padding:11px;border-radius:12px;border:1px solid #e6b9d2;font-size:15px;background:white}.hint{font-size:11px;color:#aa85a0}.filters,.tags{display:flex;gap:5px;flex-wrap:wrap}.chip{padding:5px 8px;border:1px solid #e8bed7;border-radius:99px;background:#fff;color:#a4618d;font-size:11px;cursor:pointer}.chip.on{background:#df83b6;color:white}.content{flex:1;min-height:0;overflow:auto;padding:10px 12px 25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid #ebc6dc;border-radius:14px;padding:8px;min-width:0}.thumb{aspect-ratio:1/1;border-radius:10px;background:linear-gradient(135deg,#f8d5e9,#e8dff9);display:flex;align-items:center;justify-content:center;font-size:45px;cursor:pointer}.name{font-size:12px;font-weight:700;margin:7px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.foot{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#ad8ba0;gap:3px}.icons{display:flex;gap:1px}.iconbtn{border:0;background:transparent;font-size:20px;line-height:1.2;color:#c9b7c1;padding:2px;cursor:pointer}.iconbtn.fav{color:#e64f91}.iconbtn.want{color:#e5aa24}.row{display:flex;align-items:center;justify-content:space-between;gap:7px}.detailHero{text-align:center}.heroThumb{width:128px;height:128px;margin:8px auto;border-radius:16px;background:linear-gradient(135deg,#f7d4e8,#dfebfb);display:grid;place-items:center;font-size:64px}.sub{font-size:12px;color:#ac839c}.section{font-weight:800;font-size:14px;color:#a65a89;margin:15px 0 8px}.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.part{text-align:center;font-size:10px;cursor:pointer}.partPic{aspect-ratio:1/1;border:2px solid #edc7dd;border-radius:10px;background:#f8e1ed;display:grid;place-items:center;font-size:25px}.part.selected .partPic{border-color:#d85398;background:#fbd0e7}.panel{margin-top:9px;background:#fff0f8;border:2px solid #e5a6ca;border-radius:13px;padding:8px;display:grid;gap:7px}.panelTitle{font-size:13px;font-weight:800;color:#a75888}.pill{font-size:10px;background:#f4dbe9;border-radius:99px;padding:4px 7px}.media{width:76px;height:76px;border:1px solid #e7b9d3;border-radius:9px;background:#f8d8e9;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;font-size:26px;flex:none}.small{font-size:10px;color:#aa819b}.line{border-top:1px solid #eac4da;margin:2px 0}.meta{display:flex;gap:7px;align-items:center;font-size:12px;min-height:22px}.meta strong{font-size:12px;color:#a75888;flex:none}.tag{background:#f8ddeb;color:#a75888;border-radius:99px;padding:4px 7px;font-size:10px}.editbox{padding:9px;background:white;border-radius:9px;display:grid;gap:8px}.editbox textarea,.editbox input{width:100%;border:1px solid #e8bed7;border-radius:9px;padding:8px;font:inherit}.hide{display:none}.empty{text-align:center;padding:25px;color:#a68a9c}.back{margin:4px 0 10px}.toggle{display:flex;gap:6px;align-items:center}.qrbox{background:white;color:#333;font-size:35px}.note{font-size:11px;color:#aa839d;line-height:1.5}
</style></head><body><div class="app"><div class="head">♡ Pricoletta｜コーデアイテム ♡</div><div id="listPage" style="display:flex;flex-direction:column;flex:1;min-height:0"><div class="nav"><button class="tab active" id="coordTab">コーデ</button><button class="tab" id="itemTab">アイテム</button></div><div class="tools"><input class="search" id="query" placeholder="名前・タグで検索（例：ピンク -フリル）"><div class="hint">スペース＝AND ／ -＝除外 ／ "語句"＝まとめて検索</div><div class="filters" id="cats"></div><div class="filters" id="status"></div><div class="filters" id="tagFilters"></div></div><div class="content" id="listScroll"><div class="row"><strong id="resultLabel" style="font-size:13px;color:#a65a89"></strong><button class="btn" id="reset" style="font-size:11px;padding:5px 8px">条件クリア</button></div><div class="grid" id="results" style="margin-top:10px"></div></div></div><div id="detailPage" class="content hide"><button class="btn back" id="back">‹ 一覧に戻る</button><div id="detailBody"></div></div></div><script>
const categories=['アクセ','トップス','ボトムス','シューズ'];const symbols=['💎','👚','👗','👠'];const coords=[{id:1,name:'スマイルハートコーデ',emoji:'💝',fav:true,want:false},{id:2,name:'ミルキーブルーコーデ',emoji:'🩵',fav:false,want:true},{id:3,name:'リボンプリンセスコーデ',emoji:'🎀',fav:true,want:true},{id:4,name:'スイートフラワーコーデ',emoji:'🌸',fav:false,want:false}];const sample=[['ピンク','リボン','キュート'],['水色','フリル','スイート'],['紫','リボン','エレガント'],['ピンク','フラワー','キュート']];let nextId=1;const items=coords.flatMap((c,ci)=>categories.map((cat,j)=>({id:nextId++,coordId:c.id,cat,name:(['スマイルハート','ミルキーブルー','リボンプリンセス','スイートフラワー'][ci])+cat,emoji:symbols[j],tags:[...sample[ci],...(j===0?['パール']:[])],memo:ci===0&&j===0?'ハートの飾りがかわいい♡':'',owned:ci===2||ci===0&&j!==0,fav:ci===0&&j===0,want:ci===0&&j===0||ci===1&&j<2,img:false,qr:false})));let view='coord',filter='all',catFilter='すべて',tagSelected=[],current=null,expanded=null,mode='item',editing=false;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));function count(c){return items.filter(x=>x.coordId===c.id&&x.owned).length}function renderFilters(){ $('coordTab').classList.toggle('active',view==='coord');$('itemTab').classList.toggle('active',view==='item');$('cats').innerHTML=view==='item'?['すべて',...categories].map(c=>`<button class="chip ${catFilter===c?'on':''}" data-cat="${c}">${c}</button>`).join(''):'';$('status').innerHTML=[['all','すべて'],['fav','♥ お気に入り'],['want','★ ほしい'],...(view==='item'?[['owned','所持'],['unowned','未所持']]:[])].map(([k,n])=>`<button class="chip ${filter===k?'on':''}" data-filter="${k}">${n}</button>`).join('');$('tagFilters').innerHTML=view==='item'?['ピンク','水色','紫','リボン','フリル','フラワー','キュート','スイート','パール'].map(t=>`<button class="chip ${tagSelected.includes(t)?'on':''}" data-tag="${t}">${t}</button>`).join(''):''}function parse(q){const m=q.match(/(?:"[^"]+"|\S+)/g)||[];return m.map(t=>t.replace(/^"|"$/g,''))}function renderList(){renderFilters();const terms=parse($('query').value),positive=terms.filter(x=>!x.startsWith('-')),negative=terms.filter(x=>x.startsWith('-')).map(x=>x.slice(1)).filter(Boolean);let data=view==='coord'?coords:items;data=data.filter(x=>{const hay=(x.name+' '+(x.tags||[]).join(' ')).toLowerCase();return positive.every(t=>hay.includes(t.toLowerCase()))&&negative.every(t=>!hay.includes(t.toLowerCase()))&&(filter==='all'||(filter==='fav'&&x.fav)||(filter==='want'&&x.want)||(filter==='owned'&&x.owned)||(filter==='unowned'&&!x.owned))&&(view==='coord'||(catFilter==='すべて'||x.cat===catFilter)&&tagSelected.every(t=>x.tags.includes(t)))});$('resultLabel').textContent=`検索結果：${data.length}件`;$('results').innerHTML=data.map(x=>`<div class="card"><div class="thumb" data-open="${x.id}">${x.emoji}</div><div class="name" data-open="${x.id}">${esc(x.name)}</div><div class="foot"><span>${view==='coord'?count(x)+'/4 所持':x.owned?'所持':'未所持'}</span><div class="icons"><button class="iconbtn ${x.fav?'fav':''}" data-mark="fav" data-id="${x.id}">${x.fav?'♥':'♡'}</button><button class="iconbtn ${x.want?'want':''}" data-mark="want" data-id="${x.id}">${x.want?'★':'☆'}</button></div></div></div>`).join('')||'<div class="empty">該当するものがないのだ</div>'}function openDetail(id){if(view==='item'){const item=items.find(x=>x.id===id);current=coords.find(c=>c.id===item.coordId);expanded=item.cat}else{current=coords.find(c=>c.id===id);expanded=null}mode='item';editing=false;$('listPage').style.display='none';$('detailPage').classList.remove('hide');$('detailPage').scrollTop=0;renderDetail()}function renderDetail(){const c=current;const parts=items.filter(x=>x.coordId===c.id);const it=parts.find(x=>x.cat===expanded);$('detailBody').innerHTML=`<div class="detailHero"><div class="heroThumb">${c.emoji}</div><strong>${esc(c.name)}</strong><div class="sub">${count(c)}/4 所持</div><div class="toggle" style="justify-content:center;margin:5px"><button class="iconbtn ${c.fav?'fav':''}" data-coordmark="fav">${c.fav?'♥':'♡'}</button><button class="iconbtn ${c.want?'want':''}" data-coordmark="want">${c.want?'★':'☆'}</button></div></div><div class="row"><div class="section">♡ コーデのアイテム</div><button class="btn" id="allMode" style="font-size:11px">画像 / QR</button></div><div class="parts">${parts.map(x=>`<div class="part ${expanded===x.cat?'selected':''}" data-part="${x.cat}"><div class="partPic">${x.emoji}</div><div>${x.cat}</div><div>${x.owned?'所持':'未所持'}</div></div>`).join('')}</div>${it?`<div class="panel"><div class="row"><div class="panelTitle">${it.cat}詳細</div><div class="toggle"><button class="iconbtn ${it.fav?'fav':''}" data-itemmark="fav">${it.fav?'♥':'♡'}</button><button class="iconbtn ${it.want?'want':''}" data-itemmark="want">${it.want?'★':'☆'}</button><span class="pill">${it.owned?'所持':'未所持'}</span><button class="btn" data-edit style="padding:5px 8px;font-size:11px">${editing?'完了':'編集'}</button></div></div><div class="row" style="justify-content:flex-start"><div class="media ${mode==='qr'?'qrbox':''}" data-media>${mode==='item'?(it.img?it.emoji:'▧'):(it.qr?'▦':'▧')}<span class="small">${(mode==='item'?it.img:it.qr)?'':'未登録'}</span></div><div><div style="font-size:13px;margin-bottom:8px">${esc(it.name)}</div><button class="btn" data-mode style="padding:6px 12px">${mode==='item'?'QR':'アイテム'}</button></div></div><div class="line"></div><div class="meta"><strong>タグ</strong><div class="tags">${it.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'<span class="small">未設定</span>'}</div></div><div class="meta"><strong>メモ</strong><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.memo||'未記入')}</span></div>${editing?`<div class="editbox"><label>所持状況 <select id="ownedEdit"><option value="0" ${!it.owned?'selected':''}>未所持</option><option value="1" ${it.owned?'selected':''}>所持</option></select></label><label>タグ（カンマ区切り）<input id="tagsEdit" value="${esc(it.tags.join('、'))}"></label><label>メモ<textarea id="memoEdit" rows="2">${esc(it.memo)}</textarea></label><button class="btn pink" id="saveEdit">変更を保存</button></div>`:''}</div>`:''}<div class="section">色違いコーデ</div><div class="grid">${coords.filter(x=>x.id!==c.id).map(x=>`<div class="card" data-variant="${x.id}"><div class="thumb" style="font-size:29px">${x.emoji}</div><div class="name">${esc(x.name)}</div><div class="small">${count(x)}/4 所持</div></div>`).join('')}</div><p class="note">※試作データ。画像・QRの登録は実ファイル選択やQR解析に未接続です。</p>`}function saveEdit(){const it=items.find(x=>x.coordId===current.id&&x.cat===expanded);it.owned=$('ownedEdit').value==='1';it.tags=$('tagsEdit').value.split(/[、,]/).map(x=>x.trim()).filter(Boolean);it.memo=$('memoEdit').value;editing=false;renderDetail()}$('coordTab').onclick=()=>{view='coord';filter='all';tagSelected=[];renderList()};$('itemTab').onclick=()=>{view='item';filter='all';tagSelected=[];renderList()};$('query').oninput=renderList;$('reset').onclick=()=>{$('query').value='';filter='all';catFilter='すべて';tagSelected=[];renderList()};$('cats').onclick=e=>{const el=e.target.closest('[data-cat]');if(el){catFilter=el.dataset.cat;renderList()}};$('status').onclick=e=>{const el=e.target.closest('[data-filter]');if(el){filter=el.dataset.filter;renderList()}};$('tagFilters').onclick=e=>{const el=e.target.closest('[data-tag]');if(el){const t=el.dataset.tag;tagSelected=tagSelected.includes(t)?tagSelected.filter(x=>x!==t):[...tagSelected,t];renderList()}};$('results').onclick=e=>{const mark=e.target.closest('[data-mark]');if(mark){const x=(view==='coord'?coords:items).find(x=>x.id===Number(mark.dataset.id));x[mark.dataset.mark]=!x[mark.dataset.mark];renderList();return}const el=e.target.closest('[data-open]');if(el)openDetail(Number(el.dataset.open))};$('back').onclick=()=>{$('detailPage').classList.add('hide');$('listPage').style.display='flex';renderList()};$('detailBody').onclick=e=>{let el;if((el=e.target.closest('[data-part]'))){expanded=expanded===el.dataset.part?null:el.dataset.part;editing=false;mode='item';renderDetail()}else if((el=e.target.closest('[data-coordmark]'))){current[el.dataset.coordmark]=!current[el.dataset.coordmark];renderDetail()}else if((el=e.target.closest('[data-itemmark]'))){const it=items.find(x=>x.coordId===current.id&&x.cat===expanded);it[el.dataset.itemmark]=!it[el.dataset.itemmark];renderDetail()}else if(e.target.closest('[data-mode]')){mode=mode==='item'?'qr':'item';renderDetail()}else if(e.target.closest('[data-edit]')){editing=!editing;renderDetail()}else if(e.target.closest('#saveEdit'))saveEdit();else if((el=e.target.closest('[data-variant]'))){current=coords.find(x=>x.id===Number(el.dataset.variant));expanded=null;editing=false;renderDetail()}else if(e.target.closest('[data-media]')){alert('試作版：ここから写真を選択して登録する想定です。実際のQR解析・保存は本体統合時に接続します。')}else if(e.target.closest('#allMode'))alert('コーデ内4枚の画像／QR一括切り替えは本体統合時に接続します。')};renderList();
</script></body></html>

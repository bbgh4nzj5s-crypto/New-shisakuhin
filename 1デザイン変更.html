<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pricoletta ♡ きせかえ</title><style>
:root{--pink:#e75ca9;--light:#fff2f9;--line:#efb8d7;--ink:#965477}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:var(--ink);background:#fff9fc}button,input{font:inherit}button{cursor:pointer}header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:2px solid #f6cbe4;background:white;font-weight:bold;color:var(--pink)}.app{height:100dvh;display:flex;flex-direction:column}.stage{height:39%;min-height:210px;display:flex;gap:7px;padding:9px 10px 4px}.canvas{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:18px;background:white;overflow:hidden;touch-action:none}.canvas.active{border-color:var(--pink)}.canvas .hint{position:absolute;top:50%;left:0;width:100%;text-align:center;font-size:12px;pointer-events:none;color:#caa2b8}.piece{position:absolute;width:80px;height:80px;touch-action:none;transform-origin:center;user-select:none}.piece.selected{outline:2px dashed var(--pink);outline-offset:3px}.piece .visual{width:100%;height:100%;display:grid;place-items:center;font-size:50px;pointer-events:none}.handle{position:absolute;width:25px;height:25px;border:1px solid #f4c7df;border-radius:50%;background:#fff;display:grid;place-items:center;color:#8e6c7d;font-size:14px;box-shadow:0 1px 3px #0002}.delete{left:-15px;top:-15px}.resize{right:-17px;bottom:-17px;touch-action:none}.layers{right:-18px;top:-15px}.flip{right:-18px;top:18px}.controls{display:flex;align-items:center;justify-content:space-between;padding:5px 15px;gap:10px}.controls button{border:0;background:transparent;color:#d98ab6;font-size:25px}.primary{background:#ed9cc4!important;color:white!important;border-radius:30px;padding:6px 38px;font-size:17px!important}.search{display:flex;gap:8px;padding:6px 12px;align-items:center}.search input{flex:1;min-width:0;border:1px solid #f0c4dd;border-radius:12px;padding:10px;background:#fff;font-size:14px}.filter{border:1px solid #e8a4c9;background:white;border-radius:50%;width:39px;height:39px;color:#ce6ca2;font-size:20px}.sort{border:0;background:#eea1c8;color:white;border-radius:25px;padding:10px;font-size:12px}.categories{display:flex;gap:6px;overflow-x:auto;flex-shrink:0;padding:5px 10px 8px;scrollbar-width:none}.categories button{flex-shrink:0;border:0;background:transparent;padding:7px 11px;color:#b6578a;border-radius:18px;white-space:nowrap;font-size:13px;font-weight:bold}.categories button.on{background:#f3c4dd}.items{flex:1;min-height:0;overflow-y:auto;padding:3px 10px 80px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-content:start;gap:7px}.item{position:relative;border:1.5px solid #edc6dc;border-radius:13px;min-width:0;aspect-ratio:.78;background:#fffafd;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:5px 2px}.item .emoji{font-size:clamp(24px,8vw,46px)}.item .name{font-size:9px;text-align:center;line-height:1.25;word-break:break-all}.item.worn{border-color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink)}.item small{position:absolute;right:4px;top:3px;color:#e58fba}.bottom{height:58px;flex-shrink:0;display:flex;justify-content:space-around;align-items:center;background:white;border-top:2px solid #f5c6e0}.bottom button{background:transparent;border:0;color:#a57b92;font-size:11px}.bottom button span{display:block;font-size:21px}.bottom .on{color:var(--pink)}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modal.open{display:flex}.panel{background:white;border-radius:18px;padding:20px;width:min(390px,100%);max-height:80vh;overflow:auto}.panel h3{margin:0 0 10px;color:#cf619c}.panel label{display:block;padding:8px 0}.panel button{border:1px solid var(--line);border-radius:12px;background:#fff4fa;padding:10px;margin:5px;color:#aa4d83}.panel .done{background:var(--pink);color:white;width:100%}.empty{grid-column:1/-1;text-align:center;padding:30px;font-size:13px;color:#bc92a8}@media(max-height:700px){.stage{height:34%}.bottom{height:49px}.controls{padding:2px 15px}}
</style></head><body><div class="app"><header><span>♡ Pricoletta</span><span>きせかえ</span></header><div class="stage"><div class="canvas active" id="left" data-side="left"><div class="hint">アイテムを選んでね</div></div><div class="canvas" id="right" data-side="right"><div class="hint">アイテムを選んでね</div></div></div><div class="controls"><div><button id="undo" aria-label="戻す">↶</button><button id="redo" aria-label="やり直す">↷</button></div><button class="primary" id="togglePair">けってい</button><button id="saveImage" aria-label="画像を保存">▧</button></div><div class="search"><input id="query" placeholder="アイテム名で検索" aria-label="アイテム名で検索"><button class="filter" id="filterBtn" aria-label="絞込み">☷</button><button class="sort" id="sortBtn">入手順 ▾</button></div><div class="categories" id="categories"></div><div class="items" id="items"></div><div class="bottom"><button>⌂<span>⌂</span>ホーム</button><button><span>▦</span>コーデ</button><button><span>⊞</span>登録</button><button class="on"><span>♧</span>きせかえ</button></div></div><div class="modal" id="modal"><div class="panel"><h3>絞込み</h3><p style="font-size:12px">試作品の条件検索です。既存アプリの絞込み項目との完全な一致は、元コードを接続するときに行います。</p><strong>カラー</strong><div id="colors"></div><strong>所持状態</strong><div id="ownership"></div><button id="reset">条件をリセット</button><button class="done" id="close">この条件で表示</button></div></div><script>
const samples=[{id:1,name:'ふわふわキャット',cat:'アクセ',emoji:'🎀',color:'ピンク',owned:true},{id:2,name:'いちごフリルトップス',cat:'トップス',emoji:'👚',color:'ピンク',owned:true},{id:3,name:'いちごレーススカート',cat:'ボトムス',emoji:'👗',color:'ピンク',owned:true},{id:4,name:'リボンシューズ',cat:'シューズ',emoji:'👠',color:'ピンク',owned:true},{id:5,name:'きらきらティアラ',cat:'アクセ',emoji:'👑',color:'黄色',owned:true},{id:6,name:'ブルーリボン',cat:'アクセ',emoji:'🩵',color:'水色',owned:false},{id:7,name:'ハートグラス',cat:'アクセ',emoji:'💗',color:'ピンク',owned:true},{id:8,name:'マジカルリボン',cat:'アクセ',emoji:'🎀',color:'紫',owned:false},{id:9,name:'ドリームワンピ',cat:'ワンピ',emoji:'👗',color:'紫',owned:true},{id:10,name:'コーデセットA',cat:'コーデ',emoji:'💝',color:'ピンク',owned:true},{id:11,name:'スターシューズ',cat:'シューズ',emoji:'👟',color:'水色',owned:true},{id:12,name:'フリルスカート',cat:'ボトムス',emoji:'🩷',color:'ピンク',owned:false}];
const cats=['着用中','全て','コーデ','ワンピ','アクセ','トップス','ボトムス','シューズ'];let cat='アクセ',side='left',selected=null,filterColor='すべて',filterOwn='すべて',history=[],future=[],z=10,sortAsc=false;const $=id=>document.getElementById(id);let pieces=[];function snapshot(){history.push(JSON.stringify(pieces));if(history.length>80)history.shift();future=[]}function restore(s){pieces=JSON.parse(s);selected=null;draw()}function draw(){for(const s of ['left','right']){const c=$(s);c.classList.toggle('active',side===s);c.querySelectorAll('.piece').forEach(e=>e.remove());const has=pieces.some(p=>p.side===s);c.querySelector('.hint').style.display=has?'none':'block';pieces.filter(p=>p.side===s).sort((a,b)=>a.z-b.z).forEach(p=>{const e=document.createElement('div');e.className='piece'+(selected===p.uid?' selected':'');e.style.left=p.x+'%';e.style.top=p.y+'%';e.style.width=p.size+'px';e.style.height=p.size+'px';e.style.zIndex=p.z;e.style.transform=`translate(-50%,-50%) rotate(${p.angle}deg) scaleX(${p.flip?-1:1})`;e.innerHTML=`<div class="visual">${p.emoji}</div>`;e.addEventListener('pointerdown',ev=>{if(ev.target.closest('.handle'))return;ev.preventDefault();side=p.side;selected=p.uid;const rect=c.getBoundingClientRect();let startX=ev.clientX,startY=ev.clientY,ox=p.x,oy=p.y,moved=false;e.setPointerCapture(ev.pointerId);drawSelection();e.onpointermove=mv=>{if(!moved){snapshot();moved=true}p.x=Math.max(0,Math.min(100,ox+(mv.clientX-startX)/rect.width*100));p.y=Math.max(0,Math.min(100,oy+(mv.clientY-startY)/rect.height*100));e.style.left=p.x+'%';e.style.top=p.y+'%'};e.onpointerup=()=>{e.onpointermove=null;draw()}});if(selected===p.uid){[['×','delete'],['⛶','resize'],['▱','layers'],['◀|▶','flip']].forEach(([t,k])=>{const b=document.createElement('button');b.className='handle '+k;b.textContent=t;b.title=k;b.addEventListener('pointerdown',ev=>{ev.stopPropagation();ev.preventDefault();if(k==='resize'){const r=e.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dist=Math.hypot(ev.clientX-cx,ev.clientY-cy),a=Math.atan2(ev.clientY-cy,ev.clientX-cx),sz=p.size,ang=p.angle;let started=false;b.setPointerCapture(ev.pointerId);b.onpointermove=m=>{if(!started){snapshot();started=true}p.size=Math.max(35,Math.min(220,sz*Math.hypot(m.clientX-cx,m.clientY-cy)/Math.max(dist,1)));p.angle=ang+(Math.atan2(m.clientY-cy,m.clientX-cx)-a)*180/Math.PI;e.style.width=e.style.height=p.size+'px';e.style.transform=`translate(-50%,-50%) rotate(${p.angle}deg) scaleX(${p.flip?-1:1})`};b.onpointerup=()=>{b.onpointermove=null;draw()};return}snapshot();if(k==='delete')pieces=pieces.filter(v=>v.uid!==p.uid);if(k==='layers')p.z=++z;if(k==='flip')p.flip=!p.flip;selected=k==='delete'?null:p.uid;draw()});e.appendChild(b)})}c.appendChild(e)})}renderItems()}function drawSelection(){document.querySelectorAll('.piece').forEach(e=>e.classList.remove('selected'));draw()}function renderCats(){$('categories').innerHTML='';cats.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.className=cat===v?'on':'';b.onclick=()=>{cat=v;renderCats();renderItems()};$('categories').appendChild(b)})}function renderItems(){const q=$('query').value.trim().toLowerCase();let data=samples.filter(it=>(cat==='全て'||cat==='着用中'||it.cat===cat)&&it.name.toLowerCase().includes(q)&&(filterColor==='すべて'||it.color===filterColor)&&(filterOwn==='すべて'||(filterOwn==='所持'===it.owned)));if(cat==='着用中')data=data.filter(it=>pieces.some(p=>p.id===it.id&&p.side===side));if(sortAsc)data.reverse();$('items').innerHTML='';if(!data.length)$('items').innerHTML='<div class="empty">条件に合うアイテムがありません</div>';data.forEach(it=>{const b=document.createElement('button');b.className='item'+(pieces.some(p=>p.id===it.id&&p.side===side)?' worn':'');b.innerHTML=`<span class="emoji">${it.emoji}</span><span class="name">${it.name}</span>${it.owned?'<small>♢</small>':''}`;b.onclick=()=>{snapshot();const uid=Date.now()+Math.random();pieces.push({uid,id:it.id,emoji:it.emoji,side,x:50,y:25+Math.random()*45,size:75,angle:0,flip:false,z:++z});selected=uid;draw()};$('items').appendChild(b)})}['left','right'].forEach(s=>$(s).addEventListener('pointerdown',e=>{if(e.target===$(s)){side=s;selected=null;draw()}}));$('query').oninput=renderItems;$('undo').onclick=()=>{if(history.length){future.push(JSON.stringify(pieces));restore(history.pop())}};$('redo').onclick=()=>{if(future.length){history.push(JSON.stringify(pieces));restore(future.pop())}};$('togglePair').onclick=()=>{selected=null;draw();alert('配置を確定しました（試作品のため端末への保存は未接続です）')};$('saveImage').onclick=()=>alert('画像保存は本体アプリとの統合時に接続します');$('sortBtn').onclick=()=>{sortAsc=!sortAsc;$('sortBtn').textContent=sortAsc?'逆順 ▾':'入手順 ▾';renderItems()};$('filterBtn').onclick=()=>$('modal').classList.add('open');$('close').onclick=()=>$('modal').classList.remove('open');$('reset').onclick=()=>{filterColor='すべて';filterOwn='すべて';renderFilter();renderItems()};function renderFilter(){for(const [id,opts,cur,set] of [['colors',['すべて','ピンク','水色','黄色','紫'],filterColor,v=>filterColor=v],['ownership',['すべて','所持','未所持'],filterOwn,v=>filterOwn=v]]){$(id).innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.textContent=o;b.style.background=o===cur?'#e75ca9':'#fff4fa';b.style.color=o===cur?'white':'#aa4d83';b.onclick=()=>{set(o);renderFilter();renderItems()};$(id).appendChild(b)})}}$('filterBtn').addEventListener('click',renderFilter);renderCats();draw();
</script></body></html>

 purple:{name:'紫',ink:'#75517c',mute:'#9b84ab',accent:'#c75dba',bg:'linear-gradient(150deg,#fef2fc,#f3ecff 54%,#e8f8ff)',header:'linear-gradient(#fff,#f9e9ff)',panel:'#fffbff',pale:'#f7e6fb',border:'#dec7ed',card:'#dbc5ed',album:'linear-gradient(145deg,#fff,#e5d2ff)',shadow:'#cfb8e1',active:'#9252a5',top:'#ee98d6',end:'#a753ae'},
 green:{name:'緑',ink:'#507968',mute:'#82a192',accent:'#69bd9a',bg:'linear-gradient(150deg,#f5fff9,#e7f9ef 53%,#f5f9e9)',header:'linear-gradient(#fff,#e9faf1)',panel:'#fdfffe',pale:'#e1f8eb',border:'#c8ead8',card:'#c6e7d5',album:'linear-gradient(145deg,#fff,#c9f3db)',shadow:'#a7d9c3',active:'#458f72',top:'#b5e9cc',end:'#4d9176'},
 red:{name:'赤',ink:'#895a66',mute:'#b28b95',accent:'#db8394',bg:'linear-gradient(150deg,#fff8f7,#ffeaea 55%,#fff2f3)',header:'linear-gradient(#fff,#fff0ef)',panel:'#fffdfd',pale:'#ffe3e4',border:'#f1cbd1',card:'#ecc4cb',album:'linear-gradient(145deg,#fff,#ffd8dc)',shadow:'#e5b8c1',active:'#b45c73',top:'#ffc5cc',end:'#b96476'},
 black:{name:'黒',ink:'#565565',mute:'#8d8997',accent:'#898398',bg:'linear-gradient(150deg,#fbfafc,#eae8ef 55%,#f5f1f7)',header:'linear-gradient(#fff,#eae7ef)',panel:'#fefcff',pale:'#e5e0eb',border:'#cac5d4',card:'#cbc7d3',album:'linear-gradient(145deg,#fff,#d8d4e1)',shadow:'#b7b0c0',active:'#6c667e',top:'#c2b9cc',end:'#6d687f'}
};
let currentTheme='purple';
function changeTheme(key){const t=themes[key];if(!t)return;currentTheme=key;const r=document.documentElement.style;Object.entries({'--ink':t.ink,'--mute':t.mute,'--accent':t.accent,'--bg':t.bg,'--header':t.header,'--panel':t.panel,'--pale':t.pale,'--border':t.border,'--card-border':t.card,'--album':t.album,'--btn-shadow':`0 3px ${t.shadow},inset 0 1px white`,'--input-shadow':`0 2px ${t.pale}`,'--card-shadow':`0 4px 0 ${t.shadow},0 7px 10px #55446118`,'--active-shadow':`0 3px ${t.active},inset 0 2px #ffffff99`,'--cta-shadow':`0 4px ${t.active},inset 0 2px #ffffff88`,'--cta-top':t.top,'--cta-end':t.end}).forEach(([k,v])=>r.setProperty(k,v));$('themeLabel').textContent=t.name;document.querySelector('meta[name=theme-color]').content=t.pale;}
function openThemes(){modalType='themes';$('sheetTitle').textContent='テーマカラー';$('sheetTabs').style.display='none';$('reset').style.display='none';$('apply').textContent='閉じる';$('sheetContent').innerHTML='<p class="theme-grid-title">どの色も淡いパステルを基調にした、ジュエル・ゲームのテーマです。ページ全体の色が変わります。</p><div class="theme-grid">'+Object.entries(themes).map(([key,t])=>`<button class="theme-choice" data-theme="${key}" aria-pressed="${key===currentTheme}"><span class="theme-swatch" style="--swatch:${t.accent}">✦</span>${t.name}</button>`).join('')+'</div><p class="preview-warning">テーマはこの試作を開いている間だけ適用されます。今後の本体ではユーザー設定として保存する想定です。</p>';$('overlay').classList.add('open');$('sheetContent').querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{changeTheme(b.dataset.theme);openThemes()})}
$('themeTrigger').onclick=openThemes;changeTheme('purple');
// Registration design prototype. Uploaded images are previewed in RAM only. QR images are never shown in public sample tiles.
let regStep=0,regMode='single',regType='上下',regCat='トップス',regTags=[],regImages=[],regQR=null,regName='',regMemo='',regFav=false,regWish=false,regOwned=false,regAlbum='すべて',regColor='ピンク',regCandidate='new';
const regColors=['ピンク','白','水色','黄色','紫','緑','赤','黒'];
const tagChoices=['ガーリー','フェミニン','カジュアル','クラシカル','キュート','レトロ','ナチュラル','リボン'];
const regCats=()=>regType==='ワンピ'?['アクセ','ワンピース','シューズ']:['アクセ','トップス','ボトムス','シューズ'];
const colorHex={ピンク:'#f7d4e8',白:'#f3f0fa',水色:'#d9effc',黄色:'#fff0bf',紫:'#e7dbfa',緑:'#d9f4e5',赤:'#f6d6db',黒:'#dedce5'};
function initReg(){regStep=0;regMode='single';regType='上下';regCat='トップス';regTags=[];regImages=[];regQR=null;regName='';regMemo='';regFav=false;regWish=false;regOwned=false;regAlbum='すべて';regColor='ピンク';regCandidate='new'}
function showListing(){document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.nav==='一覧'));$('regScreen').classList.remove('visible');$('listContent').classList.remove('gone');render();}
function showRegistration(reset=true){if(reset)initReg();$('listContent').classList.add('gone');$('regScreen').classList.add('visible');document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.nav==='登録'));renderReg()}
const catEmoji={アクセ:'🎀',トップス:'👚',ボトムス:'👗',シューズ:'👠',ワンピース:'👗',コーデ:'👗'};
function regRadioGroup(id,values,selected){return `<div class="reg-chip-wrap">${values.map(v=>`<button class="reg-chip ${selected===v?'active':''}" data-${id}="${safe(v)}">${safe(v)}</button>`).join('')}</div>`}
function renderReg(){
$('regProgress').innerHTML=Array.from({length:4},(_,i)=>`<span class="${i<=regStep?'now':''}"></span>`).join('');
$('regTitle').textContent=['♡ アイテムを登録','♡ コーデを選択','♡ アイテム画像・QR','♡ 登録内容の確認'][regStep];
$('regSubtitle').textContent=['登録方法を選んでね','名前と関連コーデを設定','画像の登録は任意です','内容を確認して試作一覧へ'][regStep];
$('regBack').textContent=regStep?'戻る':'一覧へ';$('regNext').textContent=['次へ ›','次へ ›','確認へ ›','試作一覧に追加 ✦'][regStep];
let h='';
if(regStep===0)h=`<div class="reg-panel"><h2>♡ 登録方法を選ぶ</h2><p>使いたい登録方法を選んでね。すべての画像は任意です。</p>${[['single','🎀','ひとつずつ登録','1アイテムずつ、名前・カテゴリ・画像・QRを登録'],['batch','💎','まとめて登録（ナチュラル）','最大4枚の画像を並び替えて、カテゴリに配置'],['detail','👗','新規登録（詳細型）','名前から登録し、コーデ詳細と同じ情報をまとめる'],['pro','✨','まとめて登録 Pro / Pro +QR','デザイン研究用の入口。複数コーデの本格処理は未実装']].map(([v,em,t,d])=>`<button class="reg-choice" data-mode="${v}" aria-pressed="${regMode===v}" style="${regMode===v?'outline:2px solid var(--accent);background:var(--pale)':''}"><span class="iconbox">${em}</span><span><strong>${t}</strong><small>${d}</small></span></button>`).join('')}</div>`;
if(regStep===1)h=`<section class="reg-panel"><h2>♡ コーデ・アイテムの基本情報</h2><label class="reg-field"><span>${regMode==='detail'?'コーデ名':'コーデ名 / アイテム名'}</span><input class="reg-input" id="regName" maxlength="60" placeholder="例：ローズリボンコーデ" value="${safe(regName)}"></label><p class="reg-help">既存のコーデと関連付けるか、色違いとして登録するかを選べます（試作では表示のみ）。</p>${regRadioGroup('candidate',['新規コーデ','このコーデに追加','色違いのコーデ'],regCandidate==='new'?'新規コーデ':regCandidate==='add'?'このコーデに追加':'色違いのコーデ')}<h2 style="margin-top:15px">♡ コーデタイプ</h2><div class="reg-typebar"><button data-type="上下" class="${regType==='上下'?'active':''}">トップス＆ボトムス</button><button data-type="ワンピ" class="${regType==='ワンピ'?'active':''}">ワンピース</button></div><h2 style="margin-top:15px">♡ 登録カテゴリ</h2><div class="reg-category">${regCats().map(c=>`<button data-catreg="${c}" class="${regCat===c?'active':''}">${catEmoji[c]} ${c}</button>`).join('')}</div><label class="reg-field"><span>保存先アルバム</span><select class="reg-select" id="regAlbum">${albums.filter(x=>x[0]!=='新規作成'&&x[0]!=='お気に入り').map(([a])=>`<option ${regAlbum===a?'selected':''}>${a}</option>`).join('')}</select></label></section>`;
if(regStep===2){h=`<section class="reg-panel"><div class="reg-image-head"><h2>♡ アイテム画像</h2><label class="reg-add">＋ 写真を選ぶ<input id="regImagesInput" type="file" accept="image/*" multiple hidden></label></div><p class="reg-help">最大4枚・任意。追加後に左右の矢印で順序を変更できるよ。1枚目からアクセ→トップス→ボトムス→シューズの順に初期配置します（あとから変更可）。</p>${regImages.length?`<div class="reg-preview-list">${regImages.map((im,i)=>`<div class="reg-preview"><img src="${im.src}" alt="選択写真 ${i+1}"><div class="controls"><button data-move="${i},-1" aria-label="左へ">←</button><small>${i+1}枚目</small><button data-move="${i},1" aria-label="右へ">→</button><button data-removeimg="${i}" aria-label="削除">×</button></div><select data-imgcat="${i}" aria-label="画像のカテゴリ">${regCats().map(c=>`<option ${im.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>`).join('')}</div>`:`<div class="reg-empty"><strong>✧</strong>画像なしでも登録できます<br>写真を選ぶと配置欄が開くよ</div>`}</section><section class="reg-panel"><h2>♡ QRコード</h2><p class="reg-help">QR画像は端末での確認用。試作一覧にはQR画像を表示しません。公開リポジトリに実際のQRをアップロードしないでね。</p><label class="reg-add">＋ QR画像を選ぶ<input type="file" accept="image/*" id="regQRInput" hidden></label>${regQR?`<div class="reg-qr"><img src="${regQR}" alt="非公開QRプレビュー"><span class="reg-help">QR画像を選択中（試作のみ）</span><button id="clearQR">削除</button></div>`:''}<label class="line-control">☑ 所持済み（手動優先）<input type="checkbox" id="regOwned" ${regOwned?'checked':''}></label></section><section class="reg-panel"><h2>♡ カラータグ</h2>${regRadioGroup('color',regColors,regColor)}<h2 style="margin-top:14px">♡ タグ</h2><div class="reg-chip-wrap">${tagChoices.map(v=>`<button class="reg-chip ${regTags.includes(v)?'active':''}" data-tag="${v}">${v}</button>`).join('')}</div><div class="reg-typebar" style="margin-top:12px"><label class="line-control">☆ お気に入り <input type="checkbox" id="regFav" ${regFav?'checked':''}></label><label class="line-control">♡ ほしい <input type="checkbox" id="regWish" ${regWish?'checked':''}></label></div><label class="reg-field"><span>メモ</span><textarea class="reg-textarea" id="regMemo" placeholder="メモ（任意）">${safe(regMemo)}</textarea></label></section>`}
if(regStep===3){let first=regImages[0];h=`<section class="reg-panel"><h2>♡ 内容を確認</h2><div class="reg-confirm-art">${first?`<img src="${first.src}" alt="画像プレビュー">`:`<div class="placeholderart">${catEmoji[regCat]||'👗'}</div>`}<div class="reg-summary"><b>${safe(regName||'名前未設定')}</b><div>${safe(regCat)} / ${safe(regType)}</div><div>${regImages.length}枚の写真 · QR ${regQR?'あり':'なし'}</div><div>${regOwned?'所持済み':'未所持'}　${regFav?'☆お気に入り ':''}${regWish?'♡ほしい':''}</div></div></div><div class="detail-tags">${[regColor,...regTags].map(t=>`<span>#${safe(t)}</span>`).join('')}</div><p class="reg-note">登録方法：${safe(regMode)}<br>関連：${safe(regCandidate)}<br>保存先：${safe(regAlbum)}<br>${regImages.map((im,i)=>`${i+1}. ${safe(im.cat)}`).join(' / ')}</p></section><div class="reg-panel"><p class="reg-help">これはデザイン試作版です。「試作一覧に追加」を押すと、このページを開いている間だけ一覧に追加します。元のプリコレッタや端末の保存データは変更しません。</p></div>`}
$('regScroll').innerHTML=h;
if(regStep===0)$('regScroll').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{regMode=b.dataset.mode;renderReg()});
if(regStep===1){$('regName').oninput=e=>regName=e.target.value;$('regAlbum').onchange=e=>regAlbum=e.target.value;$('regScroll').querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{regType=b.dataset.type;if(!regCats().includes(regCat))regCat=regCats()[0];regImages.forEach((im,i)=>im.cat=regCats()[Math.min(i,regCats().length-1)]);renderReg()});$('regScroll').querySelectorAll('[data-catreg]').forEach(b=>b.onclick=()=>{regCat=b.dataset.catreg;renderReg()});$('regScroll').querySelectorAll('[data-candidate]').forEach(b=>b.onclick=()=>{regCandidate={'新規コーデ':'new','このコーデに追加':'add','色違いのコーデ':'variant'}[b.dataset.candidate];renderReg()})}
if(regStep===2){$('regImagesInput').onchange=async e=>{const files=[...e.target.files].slice(0,4-regImages.length);if(e.target.files.length>files.length)toast('画像は最大4枚まで');for(let f of files){if(!f.type.startsWith('image/'))continue;const src=await readImage(f);regImages.push({src,cat:regCats()[Math.min(regImages.length,regCats().length-1)]})}renderReg()};$('regQRInput').onchange=async e=>{const f=e.target.files[0];if(f&&f.type.startsWith('image/')){regQR=await readImage(f);renderReg()}};if($('clearQR'))$('clearQR').onclick=()=>{regQR=null;renderReg()};$('regOwned').onchange=e=>regOwned=e.target.checked;$('regFav').onchange=e=>regFav=e.target.checked;$('regWish').onchange=e=>regWish=e.target.checked;$('regMemo').oninput=e=>regMemo=e.target.value;$('regScroll').querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let [i,dx]=b.dataset.move.split(',').map(Number),j=i+dx;if(j<0||j>=regImages.length)return;[regImages[i],regImages[j]]=[regImages[j],regImages[i]];renderReg()});$('regScroll').querySelectorAll('[data-removeimg]').forEach(b=>b.onclick=()=>{regImages.splice(+b.dataset.removeimg,1);renderReg()});$('regScroll').querySelectorAll('[data-imgcat]').forEach(b=>b.onchange=e=>regImages[+b.dataset.imgcat].cat=e.target.value);$('regScroll').querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{regColor=b.dataset.color;renderReg()});$('regScroll').querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{let t=b.dataset.tag;regTags=regTags.includes(t)?regTags.filter(x=>x!==t):[...regTags,t];renderReg()})}}
function readImage(f){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}
$('regBack').onclick=()=>{if(regStep===0){showListing();return}regStep--;renderReg();$('regScroll').scrollTop=0};
$('regNext').onclick=()=>{if(regStep===0&&regMode==='pro'){toast('Pro登録の詳細フローは、この試作では未対応です');return}if(regStep===1&&!regName.trim()){toast('名前を入力してね');$('regName').focus();return}if(regStep<3){regStep++;renderReg();$('regScroll').scrollTop=0;return}let id=Math.max(...samples.map(x=>x.id))+1;samples.unshift({id,name:regName.trim(),cat:regMode==='detail'?'コーデ':regCat,emoji:catEmoji[regCat]||'👗',image:regImages[0]?.src||null,color:colorHex[regColor],style:regTags[0]||'',shade:regColor,owned:regOwned,fav:regFav,wish:regWish,qr:!!regQR,album:regAlbum,tags:[regColor,...regTags],memo:regMemo||'試作登録したアイテム'});category='全アイテム';album='すべて';renderTabs();renderAlbums();$('query').value='';showListing();$('scroller').scrollTop=0;toast('試作一覧に追加しました ✦')};
// Ensure modal Apply handles theme close rather than overwriting filters.
const previousApply=$('apply').onclick;
$('apply').onclick=()=>{if(modalType==='themes'){closeModal();return}previousApply()};
</script></body></html>

const cats=['コーデ','全アイテム','アクセ','トップス','ボトムス','シューズ','ワンピース'];
const albums=[['すべて','♡'],['お気に入り','🎀'],['春コーデ','🌷'],['マイコーデ','👗'],['新規作成','＋']];
let category='全アイテム',album='すべて',reverse=false,selecting=false,chosen=new Set(),pane='filters',modalType='filter',activeItem=null;
let filters={owned:'all',qr:'all',mark:'all',tags:[],catExtra:'全て',sort:'new',gray:true,names:true,cols:3};let draft=null;
const $=id=>document.getElementById(id);
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function renderAlbums(){$('albums').innerHTML=albums.map(([a,ic])=>`<button class="album" data-album="${safe(a)}" aria-pressed="${album===a}"><span class="bubble">${ic}</span><small>${a}</small></button>`).join('');$('albums').querySelectorAll('[data-album]').forEach(b=>b.onclick=()=>{if(b.dataset.album==='新規作成'){toast('試作版のため追加・保存は行いません');return}album=b.dataset.album;renderAlbums();render();$('scroller').scrollTop=0})}
function renderTabs(){$('tabs').innerHTML=cats.map(c=>`<button class="tab ${category===c?'active':''}" aria-pressed="${category===c}" data-cat="${c}">${c}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderTabs();render();$('scroller').scrollTop=0})}
function matching(){const q=$('query').value.trim().toLocaleLowerCase();let data=samples.filter(x=>(category==='全アイテム'||x.cat===category)&&(album==='すべて'||(album==='お気に入り'?x.fav:x.album===album))&&(x.name+' '+x.tags.join(' ')+' '+x.memo+' '+x.cat).toLocaleLowerCase().includes(q)&&(filters.owned==='all'||(filters.owned==='owned'?x.owned:!x.owned))&&(filters.qr==='all'||(filters.qr==='registered'?x.qr:!x.qr))&&(filters.mark==='all'||(filters.mark==='fav'?x.fav:x.wish))&&(filters.tags.length===0||filters.tags.every(t=>x.tags.includes(t)))&&(filters.catExtra==='全て'||(filters.catExtra==='着用中'&&x.owned)));const sort=$('sort').value;if(sort==='name')data.sort((a,b)=>a.name.localeCompare(b.name,'ja'));else if(sort==='owned')data.sort((a,b)=>Number(b.owned)-Number(a.owned));else if(sort==='fav')data.sort((a,b)=>Number(b.fav)-Number(a.fav));else data.sort((a,b)=>a.id-b.id);if(reverse)data.reverse();return data}
function render(){let data=matching();$('grid').style.setProperty('--cols',filters.cols);$('count').textContent=`検索結果：${data.length}件`;$('grid').innerHTML=data.length?data.map(x=>`<button class="tile ${chosen.has(x.id)?'chosen':''}" data-id="${x.id}" aria-label="${safe(x.name)}"><div class="art ${filters.gray&&!x.owned?'gray':''}" style="--color:${x.color}"><span class="emoji">${x.emoji}</span>${x.fav?'<span class="heart">♥</span>':''}<span class="owned">${x.owned?'所持済み':'未所持'}</span></div><span class="checkmark">✓</span><div class="tile-footer">${filters.names?`<div class="tile-name">${safe(x.name)}</div>`:''}<div class="tile-category">${safe(x.cat)}</div><div class="tag-list">${x.tags.slice(0,2).map(t=>`<span class="tag-mini">${safe(t)}</span>`).join('')}</div></div></button>`).join(''):'<div class="empty">該当するアイテムはありません。<br>カテゴリや絞込み条件を変更してみてね。</div>';$('grid').querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const id=+b.dataset.id;if(selecting){chosen.has(id)?chosen.delete(id):chosen.add(id);render()}else openDetail(samples.find(x=>x.id===id))});$('select').textContent=selecting?'完了':'選択';$('select').classList.toggle('selected',selecting);$('scroller').classList.toggle('selection',selecting);$('selectionBar').classList.toggle('show',selecting);$('selectionCount').textContent=`${chosen.size}件選択`;$('filterBtn').classList.toggle('active',filters.owned!=='all'||filters.qr!=='all'||filters.mark!=='all'||filters.tags.length>0||filters.catExtra!=='全て');$('filterStatus').textContent=filters.tags.length?`タグ ${filters.tags.length}件・条件適用中`:filters.owned!=='all'||filters.qr!=='all'||filters.mark!=='all'||filters.catExtra!=='全て'?'条件適用中':'すべて表示'}
function openModal(){modalType='filter';pane='filters';draft=JSON.parse(JSON.stringify(filters));$('sheetTabs').style.display='flex';$('reset').style.display='block';$('apply').textContent='決定';$('sheetTitle').textContent='条件絞込み';$('overlay').classList.add('open');renderSheet()}
function row(title,values,key,multi=false){return `<section class="section"><h3>${title}</h3><div class="chips">${values.map(([value,label])=>`<button class="chip ${multi?draft.tags.includes(value)?'on':'':draft[key]===value?'on':''}" data-key="${key}" data-value="${safe(value)}" ${multi?'data-multi="1"':''}>${safe(label)}</button>`).join('')}</div></section>`}
function renderSheet(){if(modalType==='detail')return;$('sheetTabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.pane===pane));let groups=[['テイスト',['ガーリー','フェミニン','カジュアル','クラシカル','キュート','レトロ','ナチュラル']],['カラー',['ピンク','ホワイト','ブルー','パープル','レッド','グリーン','ベージュ','ブラック','ブラウン','イエロー']],['モチーフ',['リボン']]];
$('sheetContent').innerHTML=pane==='filters'?`<p class="help">複数のタグを組み合わせて絞り込めます。※サンプルデータ</p><section class="section"><button class="chip" id="tagManager">タグ・カテゴリの管理 ›</button></section>`+row('所持・登録状況',[['all','すべて'],['owned','所持済み'],['unowned','未所持']],'owned')+row('QR登録状況',[['all','すべて'],['registered','QR登録済み'],['unregistered','QR未登録']],'qr')+row('お気に入り・ほしい',[['all','すべて'],['fav','☆ お気に入り'],['want','♡ ほしい']],'mark')+groups.map(([g,vs])=>row(g,vs.map(v=>[v,v]),'tags',true)).join('')+row('表示するカテゴリ',[['全て','全て'],['着用中','着用中']],'catExtra')+row('並び順',[['new','登録順'],['name','名前順'],['owned','所持順'],['fav','お気に入り順']],'sort'):`<section class="section"><h3>未所持の表示</h3><label class="line-control">未所持をグレーで表示<input type="checkbox" data-toggle="gray" ${draft.gray?'checked':''}></label></section><section class="section"><h3>アイテムカード</h3><label class="line-control">アイテム名を表示<input type="checkbox" data-toggle="names" ${draft.names?'checked':''}></label></section>`+row('一覧の列数',[['3','3列'],['4','4列']],'cols')+`<p class="help">絞込みと表示設定は、試作ページを閉じるとリセットされます。</p>`;
$('sheetContent').querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key,v=b.dataset.value;if(b.dataset.multi){draft.tags=draft.tags.includes(v)?draft.tags.filter(a=>a!==v):[...draft.tags,v]}else draft[k]=k==='cols'?+v:v;const top=$('sheetContent').scrollTop;renderSheet();$('sheetContent').scrollTop=top});$('sheetContent').querySelectorAll('[data-toggle]').forEach(b=>b.onchange=()=>{draft[b.dataset.toggle]=b.checked});const manager=$('tagManager');if(manager)manager.onclick=()=>toast('この試作ではタグの作成・変更は行いません')}
function closeModal(){$('overlay').classList.remove('open');activeItem=null}
function openDetail(x){modalType='detail';activeItem=x;$('sheetTabs').style.display='none';$('reset').style.display='none';$('sheetTitle').textContent='コーデ・アイテム詳細';$('apply').textContent='閉じる';$('sheetContent').innerHTML=`<div class="detail-top"><div class="detail-art" style="background:${x.color}">${x.emoji}</div><div><h3>${safe(x.name)}</h3><p>${safe(x.cat)}　/　${x.owned?'所持済み':'未所持'}</p><p>${x.qr?'QR登録済み':'QR未登録'}　${x.fav?'☆ お気に入り':''} ${x.wish?'♡ ほしい':''}</p></div></div><div class="detail-tags">${x.tags.map(t=>`<span>#${safe(t)}</span>`).join('')}</div><section class="section"><h3>メモ</h3><p class="help">${safe(x.memo)}</p></section><p class="help">デザイン比較のための詳細プレビュー。編集・保存はできません。</p>`;$('overlay').classList.add('open')}
$('query').oninput=render;$('clearQuery').onclick=()=>{$('query').value='';render()};$('sort').onchange=()=>{filters.sort=$('sort').value;render()};$('direction').onclick=()=>{reverse=!reverse;$('direction').textContent=reverse?'↑':'↓';render()};$('select').onclick=()=>{selecting=!selecting;if(!selecting)chosen.clear();render()};$('selectAll').onclick=()=>{matching().forEach(x=>chosen.add(x.id));render()};$('clearSelection').onclick=()=>{chosen.clear();render()};$('filterBtn').onclick=openModal;$('sheetTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{pane=b.dataset.pane;$('sheetContent').scrollTop=0;renderSheet()});$('close').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};$('apply').onclick=()=>{if(modalType==='detail'){closeModal();return}filters=draft;$('sort').value=filters.sort;closeModal();render()};$('reset').onclick=()=>{draft={owned:'all',qr:'all',mark:'all',tags:[],catExtra:'全て',sort:'new',gray:draft.gray,names:draft.names,cols:draft.cols};renderSheet();toast('絞込みを解除しました（決定で反映）')};$('albumManage').onclick=()=>toast('試作版：アルバムの編集・保存はできません');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav!=='一覧')toast('この試作版はコーデ一覧のみ操作できます')});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});renderAlbums();renderTabs();render();
</script></body></html>

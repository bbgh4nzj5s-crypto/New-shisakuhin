<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>♡着せ替え 試作品</title><style>
:root{--pink:#e65ca8;--line:#edc1db;--bg:#fff5fb;--ink:#955577}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:var(--ink);background:#fff}button,input,select{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.head{height:43px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#fff8fc;border-bottom:1px solid var(--line);font-weight:700}.main{flex:1;min-height:0;display:flex;flex-direction:column}.stage{height:38%;min-height:190px;display:flex;gap:6px;padding:8px 9px 4px;background:#fff7fc}.board{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:18px;background-color:white;background-image:linear-gradient(45deg,#fff5fa 25%,transparent 25%),linear-gradient(-45deg,#fff5fa 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#fff5fa 75%),linear-gradient(-45deg,transparent 75%,#fff5fa 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;overflow:hidden}.board.active{border-color:var(--pink)}.sideLabel{position:absolute;top:6px;left:7px;z-index:3;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:2px 7px}.piece{position:absolute;touch-action:none;transform-origin:center;user-select:none}.piece img{width:100%;height:100%;object-fit:contain;pointer-events:none}.piece.selected{outline:2px dashed var(--pink);outline-offset:3px}.handle{position:absolute;width:25px;height:25px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink);font-size:15px;z-index:5;touch-action:none;box-shadow:0 1px 3px #9995}.h-delete{top:-16px;left:-16px}.h-transform{bottom:-16px;right:-16px}.h-layer{top:-16px;right:-16px}.h-flip{bottom:-16px;left:-16px}.toolbar{display:flex;align-items:center;gap:9px;padding:7px 11px;background:#fff;flex-shrink:0}.ghost{border:0;background:transparent;color:#d58ab3;font-size:26px}.decide{flex:1;border:0;border-radius:30px;background:linear-gradient(#ef9dc6,#dc75ac);color:white;font-size:18px;font-weight:700;padding:8px}.mini{border:1px solid var(--line);background:white;color:var(--ink);border-radius:15px;padding:7px 10px}.searchbar{display:flex;align-items:center;gap:7px;padding:6px 10px;flex-shrink:0}.searchbar input{min-width:0;flex:1;border:1px solid var(--line);border-radius:22px;padding:10px 13px;background:#fff9fd;outline:none}.round{border:0;background:#e99bc6;color:white;border-radius:50%;width:38px;height:38px;font-size:22px}.tabs{display:flex;overflow-x:auto;gap:4px;flex-shrink:0;padding:4px 8px 8px;scrollbar-width:none}.tabs button{white-space:nowrap;border:0;background:transparent;color:var(--ink);padding:7px 9px;border-radius:18px;font-size:13px;font-weight:700}.tabs button.on{background:#f8d5e9;color:#bb3c87}.catalog{flex:1;min-height:0;overflow-y:auto;padding:3px 8px 15px;background:#fffafd}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.item{min-width:0;border:1.5px solid var(--line);border-radius:15px;background:white;padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:112px;color:var(--ink)}.item img{width:100%;height:78px;object-fit:contain}.item .name{font-size:10px;line-height:1.3;overflow-wrap:anywhere;text-align:center}.item .sub{font-size:9px;color:#b997a9}.worn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.wornTitle{grid-column:span 2;text-align:center;font-weight:700;font-size:13px;padding:6px}.wornHead{text-align:center;font-size:10px;color:#b37497}.wornCell{min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:92px;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:center}.wornCell img{width:100%;height:62px;object-fit:contain}.wornCell span{font-size:10px;text-align:center}.empty{color:#c9b2bf;font-size:11px}.bottom{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:#fff8fc;padding:7px 4px max(8px,env(safe-area-inset-bottom));flex-shrink:0}.bottom button{border:0;background:transparent;color:#a77d97;font-size:11px}.bottom .chosen{color:var(--pink);font-weight:700}.overlay{position:fixed;inset:0;background:#35202c77;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(380px,100%);max-height:82dvh;overflow:auto;border-radius:20px;background:#fff;padding:18px;box-shadow:0 12px 40px #30102144}.modal h3{text-align:center;margin:2px 0 14px}.modal .action{display:block;width:100%;margin:9px 0;border:0;border-radius:14px;background:var(--pink);color:white;padding:13px;font-weight:700}.modal .cancel{background:#f5e8f0;color:var(--ink)}.filterGroup{margin:12px 0}.filterGroup label{display:block;font-size:12px;margin-bottom:5px}.filterGroup select{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:white}.note{font-size:11px;color:#a47e96;line-height:1.5}.hidden{display:none!important}@media(max-height:650px){.stage{height:34%}.item img{height:57px}.item{min-height:88px}}
</style></head><body><div class="app"><header class="head"><span>♡ Pricoletta</span><span>きせかえ</span></header><main class="main"><section class="stage"><div class="board active" data-side="left"><span class="sideLabel">LEFT</span></div><div class="board" data-side="right"><span class="sideLabel">RIGHT</span></div></section><div class="toolbar"><button class="ghost" id="undo">↶</button><button class="ghost" id="redo">↷</button><button class="decide" id="decide">けってい</button><button class="mini" id="background">背景</button></div><div class="searchbar"><input id="search" placeholder="アイテム名で検索"><button class="round" id="filterBtn" aria-label="絞込み">☷</button><select id="sort" class="mini" aria-label="並び順"><option value="default">入手順</option><option value="name">名前順</option></select></div><nav class="tabs" id="tabs"></nav><div class="catalog" id="catalog"></div></main><nav class="bottom"><button>⌂<br>ホーム</button><button>▦<br>コーデアイテム</button><button>⊞<br>登録</button><button class="chosen">♧<br>きせかえ</button></nav></div><div id="modalHost"></div><input type="file" id="upload" accept="image/*" hidden><script>
const cats=['着用中','全て','コーデ','ワンピ','アクセ','トップス','ボトムス','シューズ'];let tab='全て',side='left',selected=null,seq=1,undoStack=[],redoStack=[],backgrounds={left:'',right:''};const filter={color:'',status:'',motif:''};const svg=(kind,c)=>{const shapes={アクセ:'<path d="M22 36 L13 18 L29 26 L40 11 L51 26 L67 18 L58 36 Z"/><path d="M23 42 H57"/>',トップス:'<path d="M26 15 L13 22 L7 40 L21 45 L26 35 L26 67 L54 67 L54 35 L59 45 L73 40 L67 22 L54 15 L47 21 L33 21 Z"/>',ボトムス:'<path d="M27 15 H53 L64 65 H16 Z"/><path d="M27 24 H53"/>',シューズ:'<path d="M14 46 Q24 45 29 28 L38 30 L42 46 Q48 52 65 53 L68 64 H14 Z"/>',ワンピ:'<path d="M28 12 L18 18 L11 34 L24 40 L28 31 L29 43 L14 68 H66 L51 43 L52 31 L56 40 L69 34 L62 18 L52 12 L46 20 H34 Z"/>',コーデ:'<path d="M28 12 L18 18 L11 34 L24 40 L28 31 L29 43 L14 68 H66 L51 43 L52 31 L56 40 L69 34 L62 18 L52 12 L46 20 H34 Z"/>'};return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><g fill="${c}" stroke="#d56a9c" stroke-width="2.4" stroke-linejoin="round">${shapes[kind]||shapes.アクセ}</g><circle cx="40" cy="34" r="4" fill="#fff"/></svg>`)};
const items=[['リボンアクセ','アクセ','#ffd0e6','ピンク','リボン'],['フリルトップス','トップス','#f6b5d5','ピンク','フリル'],['いちごボトムス','ボトムス','#ff91b8','ピンク','いちご'],['リボンシューズ','シューズ','#e9a5d3','ピンク','リボン'],['ハートアクセ','アクセ','#d3b9f9','紫','ハート'],['ブルートップス','トップス','#a9dffa','水色','フリル'],['チェックボトムス','ボトムス','#f6dcaa','黄色','チェック'],['ドレス','ワンピ','#c6f0d6','緑','リボン'],['おでかけコーデ','コーデ','#f6b1dc','ピンク','フリル']].map((a,i)=>({id:i+1,name:a[0],cat:a[1],color:a[3],motif:a[4],src:svg(a[1],a[2]),qr:'',status:i<4?'所持':'未所持'}));let placements={left:[],right:[]};function snapshot(){return JSON.stringify({placements,backgrounds,seq})}function remember(){undoStack.push(snapshot());if(undoStack.length>60)undoStack.shift();redoStack=[]}function restore(s){const a=JSON.parse(s);placements=a.placements;backgrounds=a.backgrounds;seq=a.seq;selected=null;render()};function boardEl(s){return document.querySelector('.board[data-side="'+s+'"]')};function chooseSide(s){side=s;document.querySelectorAll('.board').forEach(b=>b.classList.toggle('active',b.dataset.side===s));render()};function add(item){remember();const b=boardEl(side),w=b.clientWidth,h=b.clientHeight;placements[side].push({uid:seq++,id:item.id,src:item.src,name:item.name,cat:item.cat,x:w*.5,y:h*.5,w:Math.min(105,w*.65),angle:0,flip:false,z:seq});selected=placements[side].at(-1).uid;render()};function render(){for(const s of ['left','right']){const b=boardEl(s);b.querySelectorAll('.piece').forEach(e=>e.remove());b.style.backgroundImage=backgrounds[s]?`url("${backgrounds[s]}")`:'';b.style.backgroundSize=backgrounds[s]?'cover':'22px 22px';b.style.backgroundPosition='center';placements[s].slice().sort((a,b)=>a.z-b.z).forEach(p=>{const el=document.createElement('div');el.className='piece'+(selected===p.uid&&side===s?' selected':'');el.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.w}px;transform:translate(-50%,-50%) rotate(${p.angle}deg) scaleX(${p.flip?-1:1});z-index:${p.z}`;el.innerHTML=`<img draggable="false" src="${p.src}">`;el.addEventListener('pointerdown',e=>{if(e.target.closest('.handle'))return;chooseSide(s);selected=p.uid;render();const rect=b.getBoundingClientRect(),startX=e.clientX,startY=e.clientY,ox=p.x,oy=p.y;remember();const move=ev=>{p.x=ox+ev.clientX-startX;p.y=oy+ev.clientY-startY;render()};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)},{passive:false});if(selected===p.uid&&side===s){[['×','h-delete','delete'],['⤢','h-transform','transform'],['▱','h-layer','layer'],['◀▶','h-flip','flip']].forEach(([t,cls,action])=>{const h=document.createElement('button');h.className='handle '+cls;h.textContent=t;h.title=action;h.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();if(action==='transform'){remember();const cx=b.getBoundingClientRect().left+p.x,cy=b.getBoundingClientRect().top+p.y;const startD=Math.hypot(e.clientX-cx,e.clientY-cy)||1,startA=Math.atan2(e.clientY-cy,e.clientX-cx),w=p.w,a=p.angle;const move=ev=>{const d=Math.hypot(ev.clientX-cx,ev.clientY-cy),ang=Math.atan2(ev.clientY-cy,ev.clientX-cx);p.w=Math.max(25,Math.min(350,w*d/startD));p.angle=a+(ang-startA)*180/Math.PI;render()};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);return}remember();if(action==='delete'){placements[s]=placements[s].filter(v=>v.uid!==p.uid);selected=null}else if(action==='layer')p.z=Math.max(0,...placements[s].map(v=>v.z))+1;else if(action==='flip')p.flip=!p.flip;render()});el.appendChild(h)})}b.appendChild(el)})}renderCatalog()}
function renderTabs(){document.getElementById('tabs').innerHTML='';cats.forEach(c=>{const btn=document.createElement('button');btn.textContent=c;btn.className=tab===c?'on':'';btn.onclick=()=>{tab=c;renderTabs();renderCatalog()};document.getElementById('tabs').appendChild(btn)})}function renderCatalog(){const host=document.getElementById('catalog');host.innerHTML='';if(tab==='着用中'){const grid=document.createElement('div');grid.className='worn';grid.innerHTML='<div class="wornTitle">左のコーデ</div><div class="wornTitle">右のコーデ</div><div class="wornHead">アイテム</div><div class="wornHead">QR</div><div class="wornHead">アイテム</div><div class="wornHead">QR</div>';for(const c of ['アクセ','トップス','ボトムス','シューズ','ワンピ']){for(const s of ['left','right']){const p=placements[s].filter(v=>v.cat===c).at(-1);const it=p&&items.find(v=>v.id===p.id);const cell=document.createElement('div');cell.className='wornCell';cell.innerHTML=p?`<img src="${p.src}"><span>${c}</span>`:`<span class="empty">${c}</span>`;cell.onclick=()=>{if(p){chooseSide(s);selected=p.uid;render()}};grid.appendChild(cell);const qr=document.createElement('div');qr.className='wornCell';qr.innerHTML=it?.qr?`<img src="${it.qr}">`:`<span class="empty">${c} QR<br>なし</span>`;grid.appendChild(qr)}}host.appendChild(grid);return}let filtered=items.filter(i=>(tab==='全て'||i.cat===tab)&&i.name.includes(document.getElementById('search').value)&&(!filter.color||i.color===filter.color)&&(!filter.status||i.status===filter.status)&&(!filter.motif||i.motif===filter.motif));if(document.getElementById('sort').value==='name')filtered.sort((a,b)=>a.name.localeCompare(b.name,'ja'));const cards=document.createElement('div');cards.className='cards';filtered.forEach(it=>{const el=document.createElement('button');el.className='item';el.innerHTML=`<img src="${it.src}"><span class="name">${it.name}</span><span class="sub">${it.cat}</span>`;el.onclick=()=>add(it);cards.appendChild(el)});host.appendChild(cards);if(!filtered.length)host.innerHTML='<p class="note">該当するアイテムはありません</p>'}
function showModal(html){document.getElementById('modalHost').innerHTML=`<div class="overlay"><div class="modal">${html}</div></div>`;document.querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))closeModal()}}function closeModal(){document.getElementById('modalHost').innerHTML=''}document.getElementById('filterBtn').onclick=()=>{showModal(`<h3>♡ 共通絞込み</h3><p class="note">コーデアイテム一覧と同じ絞込みを想定した試作です。選択状態はこのページ専用です。</p><div class="filterGroup"><label>カラータグ</label><select id="fColor"><option value="">すべて</option>${['ピンク','水色','黄色','紫','緑'].map(x=>`<option ${filter.color===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="filterGroup"><label>所持状態</label><select id="fStatus"><option value="">すべて</option>${['所持','未所持'].map(x=>`<option ${filter.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="filterGroup"><label>モチーフ</label><select id="fMotif"><option value="">すべて</option>${['リボン','フリル','いちご','ハート','チェック'].map(x=>`<option ${filter.motif===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="action" id="apply">この条件で絞込む</button><button class="action cancel" id="clear">条件をリセット</button>`);document.getElementById('apply').onclick=()=>{filter.color=document.getElementById('fColor').value;filter.status=document.getElementById('fStatus').value;filter.motif=document.getElementById('fMotif').value;closeModal();renderCatalog()};document.getElementById('clear').onclick=()=>{Object.keys(filter).forEach(k=>filter[k]='');closeModal();renderCatalog()}};
function exportData(){return {version:1,placements,backgrounds,items:items.map(({id,name,cat,src,qr})=>({id,name,cat,src,qr})),date:new Date().toISOString()}}function saveLocal(){try{const saved=JSON.parse(localStorage.getItem('pricoletta_demo_looks')||'[]');saved.push(exportData());localStorage.setItem('pricoletta_demo_looks',JSON.stringify(saved));return true}catch(e){alert('保存容量が足りない可能性があります');return false}}function imageExport(){const canv=document.createElement('canvas'),ctx=canv.getContext('2d');canv.width=900;canv.height=650;ctx.fillStyle='#fff';ctx.fillRect(0,0,900,650);const jobs=[];for(const [idx,s] of ['left','right'].entries()){const b=boardEl(s),rect=b.getBoundingClientRect(),x=idx*450,scale=Math.min(450/rect.width,650/rect.height);ctx.fillStyle='#fff8fc';ctx.fillRect(x,0,450,650);if(backgrounds[s])jobs.push(loadImage(backgrounds[s]).then(img=>ctx.drawImage(img,x,0,450,650)));for(const p of placements[s].slice().sort((a,b)=>a.z-b.z))jobs.push(loadImage(p.src).then(img=>{ctx.save();ctx.translate(x+225+(p.x-rect.width/2)*scale,325+(p.y-rect.height/2)*scale);ctx.rotate(p.angle*Math.PI/180);ctx.scale(p.flip?-1:1,1);ctx.drawImage(img,-p.w*scale/2,-p.w*scale/2,p.w*scale,p.w*scale);ctx.restore()}))}Promise.all(jobs).then(()=>canv.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pricoletta-kisekae.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/png'))}function loadImage(src){return new Promise((resolve,reject)=>{const i=new Image;i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}
document.getElementById('decide').onclick=()=>{showModal('<h3>♡ コーデを保存 ♡</h3><button class="action" id="export">▧ 画像を端末に保存</button><button class="action" id="book">♡ マイコーデブックに保存</button><button class="action cancel" onclick="document.getElementById(\'modalHost\').innerHTML=\'\'">キャンセル</button>');document.getElementById('export').onclick=()=>{closeModal();imageExport()};document.getElementById('book').onclick=()=>{if(saveLocal()){closeModal();alert('試作品内に編集データを保存しました（このブラウザ内のみ）')}}};document.getElementById('background').onclick=()=>{showModal('<h3>背景を設定</h3><p class="note">現在選択している側の背景を設定します。</p><button class="action" id="bgChoose">画像を選ぶ</button><button class="action cancel" id="bgClear">背景を削除</button>');document.getElementById('bgChoose').onclick=()=>document.getElementById('upload').click();document.getElementById('bgClear').onclick=()=>{remember();backgrounds[side]='';closeModal();render()}};document.getElementById('upload').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{remember();backgrounds[side]=r.result;closeModal();render()};r.readAsDataURL(f)};document.getElementById('undo').onclick=()=>{if(undoStack.length){redoStack.push(snapshot());restore(undoStack.pop())}};document.getElementById('redo').onclick=()=>{if(redoStack.length){undoStack.push(snapshot());restore(redoStack.pop())}};document.getElementById('search').oninput=renderCatalog;document.getElementById('sort').onchange=renderCatalog;document.querySelectorAll('.board').forEach(b=>b.addEventListener('pointerdown',e=>{if(e.target===b||e.target.classList.contains('sideLabel')){selected=null;chooseSide(b.dataset.side)}}));renderTabs();render();
</script></body></html>

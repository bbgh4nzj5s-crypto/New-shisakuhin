<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pricoletta｜登録画面レイアウト試作</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#885b7b;background:#fff0f9}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible{outline:3px solid #c4569e} .app{height:100dvh;max-width:600px;margin:auto;display:flex;flex-direction:column;background:#fff1fa;overflow:hidden}.top{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 17px;background:#fffafd;border-bottom:2px solid #f4c1dd;font-weight:800}.brand{color:#df60a6;font-size:17px}.top small{font-size:12px}.progress{height:8px;display:flex;gap:5px;padding:0 11px;margin:10px 0 7px;flex:none}.progress span{flex:1;background:#f6dce9;border-radius:20px}.progress span.on{background:#e969b2}.page{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 14px 8px;gap:10px}.intro{flex:none}.intro h1{font-size:20px;color:#d8559d;margin:0 0 5px}.intro p{font-size:12px;margin:0;color:#a37f96}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:none}.tab{display:flex;flex-direction:column;gap:4px;min-width:0}.tab button{height:35px;border:2px solid #efb9d9;border-radius:12px;background:#fff9fd;color:#bd5c97;font-size:12px;font-weight:800;white-space:nowrap;padding:0 2px}.tab button.active{background:#eb6bb1;color:white;border-color:#d7559b;box-shadow:0 3px #ca4c8c}.state{font-size:9px;text-align:center;border-radius:8px;background:#ececef;color:#777;padding:3px 1px;font-weight:700}.state.done{background:#ddf4e8;color:#31825b}.state.partial{background:#fff0d6;color:#a86a22}.editor{background:#fffefd;border:2px solid #f3c1df;border-radius:23px;padding:12px 13px 14px;display:flex;flex-direction:column;gap:12px;flex:none;box-shadow:0 3px 0 #f8d8ea}.editor-head{display:flex;align-items:center;justify-content:space-between}.cat-title{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800}.cat-title svg{width:23px;height:23px;stroke:#df5aa4;fill:none;stroke-width:2}.status-pill{font-size:10px;padding:4px 8px;border-radius:15px;background:#e5f6ec;color:#31825b}.gear{border:2px solid #efb9d9;background:#fff0f9;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;color:#c64d95}.gear svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9}.images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;justify-items:center}.slot{position:relative;width:100%;max-width:170px;aspect-ratio:1.15;border:2px dashed #eaa8ce;border-radius:17px;background:#fff3fa;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#cc6aa5;font-size:12px;font-weight:800;touch-action:manipulation}.slot img{width:100%;height:100%;object-fit:contain}.slot .remove{position:absolute;right:3px;top:3px;border:0;background:white;color:#c94c92;border-radius:50%;width:25px;height:25px;font-size:18px;line-height:1;z-index:2}.slot.target{border-color:#d8559d;background:#ffe4f2}.colors-title{font-size:13px;font-weight:800;color:#9d5886}.colors-title small{font-weight:400;color:#aa91a0;margin-left:6px;font-size:10px}.colors{display:flex;overflow-x:auto;gap:7px;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0}.colors::-webkit-scrollbar,.tray::-webkit-scrollbar{display:none}.color{flex:0 0 auto;display:flex;align-items:center;gap:5px;border:2px solid #f0d3e4;border-radius:11px;background:#fff9fd;padding:5px 7px;min-width:68px;font-size:10px;color:#885b7b}.color.selected{border-color:#e35ba4;background:#ffedf7}.swatch{width:22px;height:22px;border-radius:50%;border:1px solid #ddd;display:grid;place-items:center;font-size:14px;color:white;text-shadow:0 1px 2px #777;flex:none}.color.selected .swatch:after{content:'✓';font-weight:900}.traywrap{margin-top:auto;min-height:0;flex:1;display:flex;align-items:end}.tray{width:100%;height:100%;max-height:125px;min-height:84px;display:flex;align-items:center;gap:10px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none;padding:5px 1px}.add{flex:0 0 92px;height:100%;max-height:110px;border:2px dashed #e9a6cb;border-radius:15px;background:#fff8fd;color:#d55a9d;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;font-size:11px;font-weight:800}.add b{font-size:30px;line-height:1}.thumb{position:relative;flex:0 0 95px;height:100%;max-height:110px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;border:2px solid transparent;touch-action:pan-x}.thumb.selected{border-color:#e35ba4;background:#ffe6f3}.thumb img{width:100%;height:100%;object-fit:contain;pointer-events:none}.thumb .x{position:absolute;right:0;top:0;border:0;border-radius:50%;background:#d85a9e;color:white;width:24px;height:24px;z-index:2}.empty{font-size:12px;color:#b39aad}.actions{display:grid;grid-template-columns:1fr 1.35fr;gap:10px;flex:none}.actions button{height:44px;border-radius:14px;font-weight:900;font-size:13px}.back{background:#fff7fc;border:2px solid #edbbd9;color:#ad6090}.next{background:#ed69b2;color:white;border:3px solid white;box-shadow:0 4px #b94383,inset 0 0 0 2px #ffb4db}.nav{height:60px;flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid #f4c5df;background:#fffafd}.nav div{display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:9px;color:#ac8ba4;gap:1px}.nav div b{font-size:20px;font-weight:400}.nav .current{color:#d8569f;background:#fff0f8;font-weight:800}.overlay{position:fixed;inset:0;background:#3a233955;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.overlay.open{display:flex}.modal{width:min(340px,100%);background:white;border:3px solid #f1b7d8;border-radius:23px;padding:20px;box-shadow:0 10px 35px #4d234033}.modal h2{font-size:18px;color:#d8559d;margin:0 0 18px}.modal label{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:13px}.modal input{accent-color:#dc5ca3;width:20px;height:20px}.modal .close{width:100%;padding:12px;border:0;border-radius:12px;background:#e968ad;color:white;font-weight:800;margin-top:12px}.hint{font-size:11px;color:#aa819b;margin:4px 0 0}.toast{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);background:#7b5370;color:white;padding:8px 15px;border-radius:30px;font-size:12px;white-space:nowrap;display:none;z-index:10}.toast.show{display:block}
@media(max-height:760px){.top{height:40px}.page{gap:6px}.intro h1{font-size:17px}.tab button{height:29px}.editor{gap:7px;padding:8px 11px}.images .slot{max-width:130px}.tray{max-height:95px;min-height:65px}.add,.thumb{max-height:90px}.nav{height:53px}.actions button{height:39px}}
</style></head><body><main class="app"><header class="top"><div class="brand">♡ Pricoletta</div><small>ひとつずつ登録</small></header><div class="progress"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span></div><div class="page"><div class="intro"><h1>アイテム登録</h1><p>画像・QR・カラーをカテゴリごとに設定するよ。</p></div><div class="tabs" id="tabs"></div><section class="editor"><div class="editor-head"><div class="cat-title"><span id="catIcon"></span><span id="catName">アクセ</span><span class="status-pill" id="activeStatus">未登録</span></div><button class="gear" id="gear" aria-label="QR設定"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="M19 13.7a8 8 0 0 0 0-3.4l2-1.5-2-3.4-2.5 1a8 8 0 0 0-2.7-1.5L13.4 2h-3l-.4 2.9a8 8 0 0 0-2.7 1.5l-2.5-1-2 3.4 2 1.5a8 8 0 0 0 0 3.4l-2 1.5 2 3.4 2.5-1a8 8 0 0 0 2.7 1.5l.4 2.9h3l.4-2.9a8 8 0 0 0 2.7-1.5l2.5 1 2-3.4Z"/></svg></button></div><div class="images"><div class="slot" id="itemSlot" data-kind="item">＋ アイテム画像</div><div class="slot" id="qrSlot" data-kind="qr">＋ QR画像</div></div><div><div class="colors-title">カラータグ <small>横にスワイプ</small></div><div class="colors" id="colors"></div></div></section><div class="traywrap"><div class="tray" id="tray"><button class="add" id="add"><b>＋</b>未配置の画像追加</button><span class="empty" id="empty">画像を追加してね</span></div></div><div class="actions"><button class="back" id="back">‹ ひとつ前にもどる</button><button class="next" id="next">保存先を選ぶ →</button></div></div><footer class="nav"><div><b>⌂</b>ホーム</div><div><b>▦</b>コーデアイテム</div><div class="current"><b>＋</b>登録</div><div><b>♧</b>きせかえ</div><div><b>···</b>その他</div></footer></main><div class="overlay" id="overlay"><div class="modal"><h2>QR設定</h2><label><input type="checkbox" id="registered"> QRを登録済みにする</label><hr style="border:0;border-top:1px solid #f4d3e6"><label><input type="radio" name="common" value="none" checked> 共通QRなし</label><label><input type="radio" name="common" value="full"> フルコーデが共通のQR</label><label id="tbLabel"><input type="radio" name="common" value="tb"> トップス＆ボトムスが共通のQR</label><button class="close" id="close">設定を閉じる</button><p class="hint">共通QRを選ぶと、QR画像を対応するカテゴリにも表示するよ。</p></div></div><div class="toast" id="toast"></div><input id="files" type="file" accept="image/*" multiple hidden><script>
(()=>{'use strict';const icons={アクセ:'♕',トップス:'♧',ボトムス:'♙',シューズ:'♧',ワンピース:'♢'};const palette=[['ピンク','#ed86bb'],['白','#fff'],['赤','#df606b'],['黒','#333138'],['水色','#8fd6ee'],['黄色','#f0d966'],['紫','#ad90d5'],['緑','#81b98d'],['茶色','#a9856f'],['青','#6d8bd5']];let type='separate',cat='アクセ',selected=null,common='none',assets=[],seq=0;const names=()=>type==='dress'?['アクセ','ワンピース','シューズ']:['アクセ','トップス','ボトムス','シューズ'];const state={};function get(n){return state[n]??(state[n]={item:null,qr:null,checked:false,colors:[]})}const $=id=>document.getElementById(id);function notify(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function status(n){let x=get(n);return x.checked?'登録済み':x.item||x.qr||x.colors.length?'QR未登録':'未登録'}function stclass(n){return status(n)==='登録済み'?'done':status(n)==='QR未登録'?'partial':''}function render(){let list=names();$('tabs').style.gridTemplateColumns=`repeat(${list.length},minmax(0,1fr))`;$('tabs').innerHTML=list.map(n=>`<div class="tab"><button data-cat="${n}" class="${n===cat?'active':''}">${icons[n]} ${n}</button><span class="state ${stclass(n)}">${status(n)==='登録済み'?'✓ ':status(n)==='QR未登録'?'! ':'− '}${status(n)}</span></div>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});$('catIcon').textContent=icons[cat];$('catName').textContent=cat;$('activeStatus').textContent=status(cat);$('activeStatus').style.background=status(cat)==='登録済み'?'#e5f6ec':status(cat)==='QR未登録'?'#fff0d6':'#ececef';$('activeStatus').style.color=status(cat)==='登録済み'?'#31825b':status(cat)==='QR未登録'?'#a86a22':'#777';for(let kind of ['item','qr']){const slot=$(kind+'Slot'),id=get(cat)[kind];slot.innerHTML=id?`<img src="${assets.find(a=>a.id===id)?.url||''}" alt="${kind}"><button class="remove" data-remove="${kind}" aria-label="取り外す">×</button>`:kind==='item'?'＋ アイテム画像':'＋ QR画像';slot.onclick=e=>{if(e.target.closest('.remove')){remove(kind);return}if(selected!==null){place(kind)}else notify('下の画像を選んでから枠をタップしてね')};slot.ondragover=e=>{e.preventDefault();slot.classList.add('target')};slot.ondragleave=()=>slot.classList.remove('target');slot.ondrop=e=>{e.preventDefault();slot.classList.remove('target');const id=Number(e.dataTransfer.getData('text/plain'));if(id){selected=id;place(kind)}}}document.querySelectorAll('.remove').forEach(b=>b.onclick=e=>{e.stopPropagation();remove(b.dataset.remove)});$('colors').innerHTML=palette.map(([name,color])=>`<button class="color ${get(cat).colors.includes(name)?'selected':''}" data-color="${name}"><span class="swatch" style="background:${color}"></span>${name}</button>`).join('');document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{let arr=get(cat).colors,n=b.dataset.color;arr.includes(n)?arr.splice(arr.indexOf(n),1):arr.push(n);render()});renderTray();$('registered').checked=get(cat).checked;$('tbLabel').style.display=type==='dress'?'none':'flex';document.querySelector(`input[name=common][value=${common}]`).checked=true}function renderTray(){document.querySelectorAll('.thumb').forEach(x=>x.remove());$('empty').style.display=assets.filter(a=>!a.used).length?'none':'inline';for(let a of assets.filter(a=>!a.used)){const div=document.createElement('div');div.className='thumb'+(a.id===selected?' selected':'');div.draggable=true;div.innerHTML=`<img alt="追加画像" src="${a.url}"><button class="x" aria-label="画像を削除">×</button>`;div.onclick=e=>{if(e.target.closest('.x')){if(selected===a.id)selected=null;assets=assets.filter(x=>x!==a);URL.revokeObjectURL(a.url);render();return}selected=a.id;renderTray()};div.ondragstart=e=>{selected=a.id;e.dataTransfer.setData('text/plain',String(a.id))};$('tray').appendChild(div)}}function place(kind){const a=assets.find(x=>x.id===selected);if(!a)return;const old=get(cat)[kind];if(old){const previous=assets.find(x=>x.id===old);if(previous)previous.used=false}get(cat)[kind]=a.id;a.used=true;if(kind==='qr'){get(cat).checked=true;syncQR(cat)}selected=null;render()}function remove(kind){const old=get(cat)[kind];if(old){const a=assets.find(x=>x.id===old);if(a)a.used=false}get(cat)[kind]=null;if(kind==='qr'){get(cat).checked=false;syncQR(cat)}render()}function syncQR(origin){let list=common==='full'?names():common==='tb'?['トップス','ボトムス']:[];if(!list.includes(origin))return;for(let n of list){if(n===origin)continue;let x=get(n),old=x.qr;if(old&&old!==get(origin).qr){let a=assets.find(a=>a.id===old);if(a)a.used=false}x.qr=get(origin).qr;x.checked=!!get(origin).qr}}$('files').onchange=e=>{for(let f of e.target.files){assets.push({id:++seq,url:URL.createObjectURL(f),used:false})}e.target.value='';render()};$('add').onclick=()=>$('files').click();$('gear').onclick=()=>$('overlay').classList.add('open');$('close').onclick=()=>$('overlay').classList.remove('open');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};$('registered').onchange=e=>{get(cat).checked=e.target.checked;render()};document.querySelectorAll('input[name=common]').forEach(r=>r.onchange=()=>{common=r.value;if(common==='full'||common==='tb'){let source=names().find(n=>get(n).qr&&(common==='full'||['トップス','ボトムス'].includes(n)));if(source)syncQR(source)}render()});$('back').onclick=()=>notify('試作品：前のページは未接続だよ');$('next').onclick=()=>notify('試作品：保存先画面は未接続だよ');render();})();
</script></body></html>

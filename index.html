<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff3f9"><title>Pricoletta｜一覧UIデザイン試作</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#754866;--pink:#ed65ad;--deep:#c9468b;--line:#f1d2e5;--bg:#fff5fb;--white:#fff;--ink:#754866}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #f78cc9;outline-offset:2px}.app{height:100dvh;max-width:600px;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(165deg,#fff7fc 0%,#fff0f8 62%,#f8efff)}.header{height:calc(54px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;background:#fffafd;border-bottom:1px solid #f2d7e7}.brand{font-weight:900;color:#db529e;font-size:21px;letter-spacing:-.5px;text-shadow:0 2px #fff}.header-side{font-size:10px;color:#a77e99;background:#fff0f8;border-radius:20px;padding:5px 9px;font-weight:800}.content{flex:1;min-height:0;display:flex;flex-direction:column}.heading{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 8px}.heading h1{font-size:20px;margin:0;color:#b64c8a;letter-spacing:.02em}.heading small{font-size:10px;color:#a68199}.albums{flex:0 0 auto;padding:0 0 8px}.albums-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 7px;font-size:12px;font-weight:900}.albums-head button{background:none;color:#c65e9c;border:0;font-size:11px;font-weight:800}.album-row{display:flex;gap:14px;padding:2px 16px 7px;overflow-x:auto;scrollbar-width:none}.album-row::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}.album{width:64px;flex:0 0 64px;background:none;border:0;display:flex;align-items:center;flex-direction:column;gap:5px;padding:0;color:#8f6d83}.bubble{width:57px;height:57px;border-radius:50%;background:linear-gradient(145deg,#fff,#ffe1f2);border:3px solid white;box-shadow:0 2px 0 #edc2db,0 4px 9px #d989bb25;display:flex;align-items:center;justify-content:center;font-size:27px}.album[aria-pressed=true] .bubble{outline:2px solid #e968ac;outline-offset:1px}.album small{font-size:10px;white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis}.toolbar{padding:3px 14px 0;display:flex;flex-direction:column;gap:9px}.filters{display:flex;gap:7px;align-items:center}.filter-btn{background:#fff;border:1.5px solid #edc8df;color:#ac558a;border-radius:13px;height:39px;padding:0 12px;font-size:12px;font-weight:900;display:flex;gap:7px;align-items:center;box-shadow:0 2px #f6dbe9}.filter-btn.active{background:#ffe7f4;border-color:#e76fb0}.filter-status{flex:1;text-align:right;color:#a4879a;font-size:10px}.search{position:relative}.search svg{position:absolute;top:11px;left:13px;color:#bd8aa8}.search input{width:100%;height:42px;background:#fff;border:1.5px solid #ebc9dc;border-radius:14px;padding:0 39px;color:#754866;font-size:13px;outline:none;box-shadow:0 2px #f5e1ed}.search input::placeholder{color:#b397a9}.tabs{display:flex;gap:6px;overflow-x:auto;padding:11px 14px 9px;scrollbar-width:none;flex:0 0 auto}.tab{border:1px solid #edc5df;border-radius:11px;background:#fff;color:#ad6794;min-height:34px;padding:0 12px;white-space:nowrap;font-size:11px;font-weight:900;box-shadow:0 2px #f4dce9}.tab.active{background:#ef72b7;color:white;border-color:#df58a0;box-shadow:0 3px #c64d8c}.results{margin:0 14px 0;padding:6px 2px 9px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0d4e5;gap:5px;flex:0 0 auto}.count{font-size:11px;color:#926b84;font-weight:800;white-space:nowrap}.actions{display:flex;align-items:center;gap:5px}.sort{border:1px solid #ecd1e1;border-radius:9px;background:white;color:#966387;font-size:11px;padding:7px 5px;max-width:90px}.direction,.select{border:1px solid #edc6dd;border-radius:9px;background:#fff;color:#b35b90;height:32px;font-size:11px;font-weight:900;padding:0 10px}.select.selected{background:#fce0f0;border-color:#e27db5}.grid-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:13px 14px 28px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 9px}.tile{border:1px solid #f1d6e6;border-radius:16px;background:white;box-shadow:0 3px 0 #f4dfeb;overflow:hidden;text-align:left;color:#815a74;padding:0;position:relative;transition:transform .16s}.tile:active{transform:scale(.97)}.art{height:auto;aspect-ratio:4/5;background:var(--color,#fce2f1);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.art:before{content:"";position:absolute;width:115%;height:75%;border-radius:50%;background:#fff7;top:-45%;left:-8%}.art .emoji{font-size:clamp(34px,11vw,64px);filter:drop-shadow(0 7px 4px #8a648433);z-index:1}.tile-footer{padding:7px 7px 8px;min-height:48px}.tile-title{font-size:11px;line-height:1.25;font-weight:900;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tile-sub{margin-top:5px;color:#a4879a;font-size:9px}.heart{position:absolute;right:5px;top:5px;font-size:15px;color:#e86aa9;text-shadow:0 1px white;z-index:1}.owned{position:absolute;left:5px;bottom:5px;z-index:1;background:#fffffff2;color:#b15b8c;font-size:8px;border-radius:10px;padding:3px 6px;font-weight:800}.checkmark{display:none;position:absolute;right:6px;bottom:55px;z-index:3;background:#e866ad;color:#fff;border:2px solid white;border-radius:50%;width:23px;height:23px;align-items:center;justify-content:center;font-size:12px}.selection .checkmark{display:flex;background:#fff;color:#e866ad}.selection .tile.chosen .checkmark{background:#e866ad;color:#fff}.selection .tile.chosen{outline:2px solid #e866ad;outline-offset:-2px}.empty{grid-column:1/-1;text-align:center;font-size:13px;color:#9b7790;padding:45px 8px;line-height:1.7}.nav{height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fffafd;border-top:1px solid #f1cfdf;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));flex:0 0 auto}.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;background:none;color:#aa90a1;gap:4px;font-size:9px;font-weight:800}.nav button.active{color:#da509b;background:#fff0f8}.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.overlay{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:#63405c66;z-index:20}.overlay.open{display:flex}.sheet{width:min(600px,100%);background:#fffafd;border-radius:23px 23px 0 0;padding:17px 20px calc(23px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #8b588333;animation:rise .2s ease}.sheet h2{margin:0 0 14px;color:#b95794;font-size:18px}.sheet p{font-size:12px;color:#977b8f;line-height:1.6}.sheet-option{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.chip{border:1px solid #f1c8e1;border-radius:11px;background:#fff;color:#a45e8a;padding:9px 12px;font-size:12px;font-weight:800}.chip.on{background:#ffe2f2;border-color:#e469aa;color:#bc4f8d}.sheet-buttons{display:flex;gap:9px}.primary,.secondary{height:44px;border-radius:12px;font-weight:900;font-size:13px}.primary{flex:1;background:var(--pink);color:white;border:2px solid white;box-shadow:0 4px var(--deep),inset 0 0 0 1px #ffb7db}.primary:active{transform:translateY(3px);box-shadow:0 1px var(--deep)}.secondary{flex:1;background:white;border:1px solid #efc3dc;color:#a95b8e}.toast{position:fixed;bottom:calc(75px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:10px 16px;background:#774965ee;color:white;border-radius:14px;font-size:12px;z-index:50;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}.toast.show{opacity:1}.demo{position:absolute;top:calc(57px + env(safe-area-inset-top));right:13px;font-size:9px;color:#ae8ba0;pointer-events:none}@keyframes rise{from{transform:translateY(24px);opacity:.7}to{transform:translateY(0);opacity:1}}@media(max-width:350px){.grid{gap:8px 6px}.toolbar{gap:7px}.tabs{padding-top:8px}.heading{padding-top:9px}.album-row{gap:10px}}
</style></head><body><div class="app"><header class="header"><div class="brand">♡ Pricoletta</div><span class="header-side">UI DESIGN TEST</span></header><main class="content"><div class="heading"><h1>コーデ・アイテム</h1><small>デザイン試作版</small></div><section class="albums"><div class="albums-head"><span>♡ マイアルバム</span><button id="albumManage">アルバム管理 ›</button></div><div class="album-row" id="albums"></div></section><div class="toolbar"><div class="filters"><button class="filter-btn" id="filterBtn"><span>☷</span> 条件絞込み</button><span class="filter-status" id="filterStatus">すべて表示</span></div><div class="search"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="query" type="search" placeholder="アイテム名・コーデ名を検索" autocomplete="off"></div></div><nav class="tabs" id="tabs" aria-label="カテゴリ"></nav><div class="results"><div class="count" id="count">検索結果：0件</div><div class="actions"><select id="sort" class="sort" aria-label="並び順"><option value="registered">登録順</option><option value="name">名前順</option><option value="owned">所持状況順</option><option value="fav">お気に入り順</option></select><button class="direction" id="direction" aria-label="並び順を反転">↓</button><button class="select" id="select">選択</button></div></div><div class="grid-scroll" id="scroll"><div class="grid" id="grid"></div></div></main><nav class="nav" id="nav"><button data-nav="ホーム"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10h-7v-6h-4v6H3z"/></svg>ホーム</button><button class="active" data-nav="一覧"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>コーデ</button><button data-nav="登録"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>登録</button><button data-nav="きせかえ"><svg viewBox="0 0 24 24"><path d="M9 3 6 5 3 6l-1 5 4 2v8h12v-8l4-2-1-5-3-1-3-2-3 4z"/></svg>きせかえ</button><button data-nav="メニュー"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>メニュー</button></nav></div><div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><h2 id="sheetTitle">条件絞込み</h2><p id="sheetDesc">登録したコーデの表示条件を選べます。</p><div class="sheet-option" id="chips"><button class="chip on" data-filter="all">すべて</button><button class="chip" data-filter="owned">所持済み</button><button class="chip" data-filter="wish">ほしい</button><button class="chip" data-filter="fav">お気に入り</button></div><div class="sheet-buttons"><button class="secondary" id="close">閉じる</button><button class="primary" id="apply">この条件で表示</button></div></div></div><div class="toast" id="toast" role="status"></div><script>
// 独立したデザイン試作。localStorageや元アプリのデータは一切使用しません。
const samples=[{id:1,name:'ローズリボンコーデ',cat:'フルコーデ',emoji:'👗',color:'#f9d4e7',owned:true,fav:true,album:'お気に入り'}, {id:2,name:'パールブラウス',cat:'トップス',emoji:'👚',color:'#fce4e7',owned:true,fav:false,album:'春コーデ'}, {id:3,name:'ふんわりスカート',cat:'ボトムス',emoji:'🩰',color:'#f5dff4',owned:false,fav:true,album:'お気に入り'}, {id:4,name:'レースワンピース',cat:'ワンピース',emoji:'👗',color:'#e5e4fc',owned:true,fav:true,album:'春コーデ'}, {id:5,name:'リボンシューズ',cat:'シューズ',emoji:'👠',color:'#fce3d8',owned:true,fav:false,album:'お気に入り'}, {id:6,name:'ハートアクセ',cat:'アクセ',emoji:'🎀',color:'#ffe8f2',owned:false,fav:false,album:'春コーデ'}, {id:7,name:'チェックコーデ',cat:'フルコーデ',emoji:'🧥',color:'#e8e7fc',owned:true,fav:false,album:'春コーデ'}, {id:8,name:'ミントトップス',cat:'トップス',emoji:'👕',color:'#ddf3ee',owned:true,fav:true,album:'お気に入り'}, {id:9,name:'ピンクパンプス',cat:'シューズ',emoji:'👡',color:'#ffe2ea',owned:false,fav:true,album:'お気に入り'}];
const categories=['フルコーデ','全アイテム','トップス','ボトムス','シューズ','アクセ','ワンピース'];let cat='フルコーデ',album='すべて',filter='all',reverse=false,selecting=false,chosen=new Set();const $=id=>document.getElementById(id);function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2100)}function renderAlbums(){const data=[['すべて','♡'],['お気に入り','🎀'],['春コーデ','🌷'],['新規作成','＋']];$('albums').innerHTML=data.map(([name,emoji])=>`<button class="album" data-album="${name}" aria-pressed="${album===name}"><span class="bubble">${emoji}</span><small>${name}</small></button>`).join('');document.querySelectorAll('[data-album]').forEach(b=>b.onclick=()=>{let a=b.dataset.album;if(a==='新規作成'){toast('試作版：アルバムの追加は行いません');return}album=a;renderAlbums();render()})}function renderTabs(){$('tabs').innerHTML=categories.map(x=>`<button class="tab ${cat===x?'active':''}" data-cat="${x}" aria-pressed="${cat===x}">${x}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;renderTabs();render();$('scroll').scrollTop=0})}function render(){const q=$('query').value.trim().toLocaleLowerCase();let data=samples.filter(x=>(cat==='全アイテム'||x.cat===cat)&&(album==='すべて'||x.album===album)&&x.name.toLocaleLowerCase().includes(q)&&(filter==='all'||(filter==='owned'&&x.owned)||(filter==='wish'&&!x.owned)||(filter==='fav'&&x.fav)));let sort=$('sort').value;if(sort==='name')data.sort((a,b)=>a.name.localeCompare(b.name,'ja'));else if(sort==='owned')data.sort((a,b)=>Number(b.owned)-Number(a.owned));else if(sort==='fav')data.sort((a,b)=>Number(b.fav)-Number(a.fav));else data.sort((a,b)=>a.id-b.id);if(reverse)data.reverse();$('count').textContent=`検索結果：${data.length}件`;$('grid').innerHTML=data.length?data.map(x=>`<button class="tile ${chosen.has(x.id)?'chosen':''}" data-id="${x.id}" aria-label="${x.name}"><div class="art" style="--color:${x.color}"><span class="emoji">${x.emoji}</span>${x.fav?'<span class="heart">♥</span>':''}<span class="owned">${x.owned?'所持済み':'未所持'}</span></div><span class="checkmark">✓</span><div class="tile-footer"><div class="tile-title">${x.name}</div><div class="tile-sub">${x.cat}</div></div></button>`).join(''):'<div class="empty">該当するアイテムはありません。<br>カテゴリや検索条件を変更してみてね。</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let id=Number(b.dataset.id);if(selecting){chosen.has(id)?chosen.delete(id):chosen.add(id);render();}else toast(samples.find(x=>x.id===id).name+'（デザイン試作）')});$('select').textContent=selecting?`完了 ${chosen.size}`:'選択';$('select').classList.toggle('selected',selecting);$('filterBtn').classList.toggle('active',filter!=='all');$('filterStatus').textContent={all:'すべて表示',owned:'所持済み',wish:'未所持 / ほしい',fav:'お気に入り'}[filter]}
$('query').oninput=render;$('sort').onchange=render;$('direction').onclick=()=>{reverse=!reverse;$('direction').textContent=reverse?'↑':'↓';render()};$('select').onclick=()=>{selecting=!selecting;if(!selecting&&chosen.size)toast(`${chosen.size}件を選択しました（保存・削除はしません）`);if(!selecting)chosen.clear();document.querySelector('.grid-scroll').classList.toggle('selection',selecting);render()};$('filterBtn').onclick=()=>{$('overlay').classList.add('open')};$('close').onclick=()=>{$('overlay').classList.remove('open')};$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));});$('apply').onclick=()=>{filter=document.querySelector('.chip.on').dataset.filter;$('overlay').classList.remove('open');render()};$('albumManage').onclick=()=>toast('この試作版ではアルバムは編集できません');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav!=='一覧')toast('比較用：コーデ一覧のみ試作しています')});renderAlbums();renderTabs();render();
</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pricoletta｜アイテム編集 2案比較</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#fff0f8;color:#8c5379}button,input,textarea{font:inherit}button{cursor:pointer}.switch{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;padding:5px;background:#fff;border:2px solid #e6b0d0;border-radius:18px;box-shadow:0 3px 12px #bb8eac66;white-space:nowrap}.switch button{border:0;border-radius:12px;padding:10px 13px;background:#fff2f8;color:#a65a8d;font-size:13px;font-weight:700}.switch button.on{background:#dc6eae;color:white}.backdrop{position:fixed;inset:0;background:#b77a9a66;display:grid;place-items:center;padding:calc(66px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom))}.under{position:absolute;inset:0;padding:110px 25px;background:linear-gradient(150deg,#fff9fd,#ffe9f5);opacity:.65}.under article{background:white;border:3px solid #e6acd0;border-radius:24px;padding:20px}.modal{position:relative;display:flex;flex-direction:column;width:min(100%,480px);height:min(690px,100%);min-height:0;background:#fff9fd;border:3px solid #e5a0c8;border-radius:26px;box-shadow:0 10px 40px #78455c50;overflow:hidden}.header{flex:none;padding:13px 15px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0d4e4;background:white}.header strong{font-size:20px;color:#a45185}.close{background:white;border:2px solid #e8acd0;color:#b85e94;border-radius:13px;padding:8px 12px;font-weight:700}.media{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px;background:#fff6fb}.media.fixed{flex:none;border-bottom:1px solid #f0d4e4}.media label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:98px;border:2px dashed #dfa0c7;background:#fff;border-radius:15px;font-size:12px;font-weight:700;text-align:center;cursor:pointer}.media .sym{font-size:26px}.media input{display:none}.media img{max-width:100%;max-height:64px;object-fit:contain}.scroll{overflow:auto;flex:1;min-height:0;padding:14px;overscroll-behavior:contain}.section{margin-bottom:15px}.section h3{margin:0 0 10px;font-size:17px;color:#9c4d7f}.tagrow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:9px 0}.tagrow b{min-width:64px;font-size:14px}.chip{background:#fff;border:2px solid #e7b3d1;border-radius:24px;padding:7px 10px;color:#a4578a;font-size:13px}.chip.on{background:#dd76b2;color:white}.add{border:1px dashed #ce83b1;background:#fff7fb;color:#b15c90;border-radius:15px;padding:8px 11px;font-size:13px}.memo{width:100%;min-height:80px;resize:vertical;border:2px solid #e7b3d1;border-radius:13px;padding:10px;color:#865072;background:white}.footer{flex:none;background:#fff;border-top:1px solid #f0d4e4;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}.footrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;font-size:13px;font-weight:700}.marks{display:flex;gap:8px}.mark{border:2px solid #e6b0cf;border-radius:50%;background:white;color:#bd6b9e;width:38px;height:38px;font-size:22px}.mark.on{background:#e875b4;color:white}.save{width:100%;border:3px solid white;outline:2px solid #d889b5;border-radius:15px;background:#db6eac;color:white;font-weight:800;padding:11px;box-shadow:0 5px 0 #aa4c85}.hint{font-size:11px;color:#a17a92;margin-top:8px}.notice{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:30;background:#84516f;color:white;padding:10px 16px;border-radius:20px;display:none;font-size:13px}.notice.show{display:block}@media(max-height:720px){.backdrop{padding-top:calc(59px + env(safe-area-inset-top))}.media label{min-height:75px}.header{padding:9px 13px}.scroll{padding:10px 14px}.section{margin-bottom:10px}}
</style></head><body><nav class="switch"><button id="a" class="on" onclick="setMode('a')">A：画像・QR固定</button><button id="b" onclick="setMode('b')">B：画像・QRもスクロール</button></nav><div class="backdrop"><div class="under"><article><h2>アクセ詳細</h2><p>アイテム画像　　名前・QR</p><p>タグ　メモ　♡ ☆</p></article></div><div class="modal"><header class="header"><strong>アイテム編集</strong><button class="close" onclick="toast('試作品のため閉じずに比較できます')">× 閉じる</button></header><div id="fixedMedia"></div><main class="scroll" id="scroll"><div id="scrollMedia"></div><section class="section"><h3>タグ</h3><div id="tagCategories"></div><button class="add" onclick="addCategory()">＋ タグカテゴリを追加</button></section><section class="section"><h3>メモ</h3><textarea class="memo" placeholder="メモを入力できます"></textarea></section><p class="hint">※ 操作感を比べるための独立試作品です。元のアプリのデータは変更しません。</p></main><footer class="footer"><div class="footrow"><span>お気に入り・ほしい</span><div class="marks"><button class="mark" onclick="this.classList.toggle('on')" aria-label="お気に入り">♡</button><button class="mark" onclick="this.classList.toggle('on')" aria-label="ほしい">☆</button></div></div><button class="save" onclick="toast('試作品のため保存は行いません')">変更を保存 →</button></footer></div></div><div class="notice" id="notice"></div><script>
const media='<div class="media"><label><span class="sym">▧</span><span>アイテム画像を選択</span><input type="file" accept="image/*" onchange="preview(this)"></label><label><span class="sym">▦</span><span>QR画像を選択</span><input type="file" accept="image/*" onchange="preview(this)"></label></div>';let mode='a';let cats=[{name:'カラー',tags:['赤','黒','黄色','ピンク','水色','紫']},{name:'テイスト',tags:['キュート','クール','エレガント']}];let selected=new Set();function setMode(m){mode=m;document.getElementById('a').classList.toggle('on',m==='a');document.getElementById('b').classList.toggle('on',m==='b');document.getElementById('fixedMedia').innerHTML=m==='a'?media:'';document.getElementById('scrollMedia').innerHTML=m==='b'?media:'';document.getElementById('scroll').scrollTop=0}function preview(inp){const f=inp.files?.[0];if(!f)return;const url=URL.createObjectURL(f);inp.parentElement.querySelector('.sym').replaceWith(Object.assign(document.createElement('img'),{src:url}));inp.parentElement.querySelector('span:last-of-type').textContent=f.name.slice(0,12)}function renderTags(){document.getElementById('tagCategories').innerHTML=cats.map((c,i)=>'<div class="tagrow"><b>'+esc(c.name)+' ›</b>'+c.tags.map(t=>'<button class="chip '+(selected.has(c.name+':'+t)?'on':'')+'" onclick="toggleTag('+i+',\''+escJS(t)+'\')">'+esc(t)+'</button>').join('')+'<button class="add" onclick="addTag('+i+')">＋ 追加する</button></div>').join('')}function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function escJS(s){return s.replaceAll('\\','\\\\').replaceAll("'","\\'")}function toggleTag(i,t){let k=cats[i].name+':'+t;selected.has(k)?selected.delete(k):selected.add(k);renderTags()}function addTag(i){let t=prompt(cats[i].name+'に追加するタグ名');if(t?.trim()&&!cats[i].tags.includes(t.trim())){cats[i].tags.push(t.trim());renderTags()}}function addCategory(){let n=prompt('追加するタグカテゴリ名');if(n?.trim()&&!cats.some(c=>c.name===n.trim())){cats.push({name:n.trim(),tags:[]});renderTags()}}let timer;function toast(s){let n=document.getElementById('notice');n.textContent=s;n.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>n.classList.remove('show'),2200)}renderTags();setMode('a');
</script></body></html>

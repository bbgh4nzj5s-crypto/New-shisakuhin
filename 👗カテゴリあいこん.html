<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pricoletta｜アイコン見本帳</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#754b66;background:#fff8fc}*{box-sizing:border-box}body{margin:0}.app{max-width:560px;margin:auto;padding:20px 15px 90px}h1{font-size:23px;margin:0;color:#c45191}p{line-height:1.6}.sub{font-size:13px;color:#9c7b8f}.card{background:white;border:1px solid #f4d5e6;border-radius:20px;padding:15px;margin:16px 0;box-shadow:0 3px 9px #e9bbd333}h2{font-size:17px;margin:0 0 6px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.choice{background:#f2f2f4;border:2px solid transparent;border-radius:16px;padding:12px 4px 10px;color:#888890;display:flex;align-items:center;flex-direction:column;gap:7px;min-height:103px;cursor:pointer;font:inherit}.choice.selected{background:#ffe0ef;border-color:#ec74af;color:#d64e96;box-shadow:0 3px 0 #e7a3c5}.choice svg{height:42px;width:42px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.choice span{font-size:12px;font-weight:700}.legend{display:flex;gap:10px;margin:15px 0}.sample{flex:1;padding:14px;border-radius:14px;text-align:center;font-size:12px;font-weight:bold}.gray{background:#eeeef0;color:#85858c}.pink{background:#ffe0ef;color:#d64e96}.preview{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 2px;border-radius:12px;min-width:0}.tile svg{height:34px;width:34px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.tile span{font-size:10px;font-weight:700}.actions{display:flex;gap:10px}.btn{border:3px solid white;box-shadow:0 4px 0 #c74483;background:#f36baa;border-radius:15px;color:white;padding:13px 12px;font-size:14px;font-weight:800;flex:1}.btn.secondary{background:#fff;border:2px solid #e7a3c5;color:#c45191;box-shadow:none}#notice{font-size:12px;min-height:20px;color:#a94d7f}footer{font-size:12px;color:#987b8e}</style></head><body><main class="app"><h1>♡ Pricoletta</h1><p style="margin:3px 0 0;font-weight:700">カテゴリ＆QR アイコン見本帳</p><p class="sub">形を比較して選ぼう。全カテゴリで同じ配色を使用します。ピンク＝未所持・選択中／グレー＝所持・未選択。</p><div class="legend"><div class="sample gray">グレー<br>所持・未選択</div><div class="sample pink">ピンク<br>未所持・選択中</div></div><div id="sections"></div><section class="card"><h2>♡ 選んだアイコンの組み合わせ</h2><p class="sub">グレー表示とピンク表示を比較できます。</p><div class="preview" id="previewGray"></div><div style="height:10px"></div><div class="preview" id="previewPink"></div></section><div class="actions"><button class="btn" id="copy">選択内容をコピー</button><button class="btn secondary" id="reset">初期化</button></div><p id="notice" role="status"></p><footer>※ この見本帳は独立した試作品です。Pricoletta本体には変更を加えません。<br>※ アイコンは形を選ぶための簡易イラストです。選択後に線や角丸を調整できます。</footer></main><script>
const paths={
shirt:'<path d="M17 7 22 4l5 4 5-4 5 3 5 9-7 4-3-5v26H12V15l-3 5-7-4 5-9 5-3 5 4z"/>',
blouse:'<path d="m17 5 7 4 7-4 7 6 4 10-8 3-3-5v22H17V19l-3 5-8-3 4-10z"/><path d="M17 5q7 14 14 0M24 9v30M20 15h8"/>',
cardigan:'<path d="m18 6-8 3-6 12 8 4 4-7v23h20V18l4 7 8-4-6-12-8-3-8 6z"/><path d="M24 12v29M27 19h1M27 27h1M27 35h1"/>',
pants:'<path d="M11 5h26l3 37H27l-3-21-3 21H8z"/><path d="M11 13h26"/>',
skirt:'<path d="M17 6h14l2 8 9 27H6l9-27z"/><path d="M15 14h18M19 18l-4 23M29 18l4 23"/>',
shorts:'<path d="M9 7h30l2 25-14 2-3-13-3 13-14-2z"/><path d="M9 14h30"/>',
heels:'<path d="M6 31c5-1 10-7 13-15l7 3-3 8c6 5 12 5 18 7v7H6z"/><path d="M13 40v5M34 41v4"/>',
sneakers:'<path d="M5 26q9 0 13-11l8 2 5 9 12 6v9H5z"/><path d="M6 35h37M20 24l7 3M18 29l7 3"/>',
boots:'<path d="M15 5h17v22c1 4 6 6 12 8v7H7v-8l8-5z"/><path d="M15 12h17M7 36h37"/>',
bow:'<path d="M24 19C15 8 5 10 5 19s10 11 19 5c9 6 19 4 19-5S33 8 24 19z"/><circle cx="24" cy="22" r="5"/><path d="m21 27-7 15 10-5 10 5-7-15"/>',
crown:'<path d="M5 14 16 24 24 7l8 17 11-10-4 26H9z"/><path d="M9 34h30"/><circle cx="5" cy="12" r="2"/><circle cx="24" cy="5" r="2"/><circle cx="43" cy="12" r="2"/>',
necklace:'<path d="M9 8c0 17 6 25 15 25S39 25 39 8"/><path d="m24 27 7 7-7 10-7-10z"/><circle cx="9" cy="8" r="2"/><circle cx="39" cy="8" r="2"/>',
qr:'<rect x="5" y="5" width="14" height="14" rx="1"/><rect x="9" y="9" width="6" height="6"/><rect x="29" y="5" width="14" height="14" rx="1"/><rect x="33" y="9" width="6" height="6"/><rect x="5" y="29" width="14" height="14" rx="1"/><rect x="9" y="33" width="6" height="6"/><path d="M28 28h6v6h-6zM39 28h4M39 33v10M28 39h6v4h-6"/>',
qrrounded:'<rect x="5" y="5" width="15" height="15" rx="4"/><rect x="9" y="9" width="7" height="7" rx="1"/><rect x="28" y="5" width="15" height="15" rx="4"/><rect x="32" y="9" width="7" height="7" rx="1"/><rect x="5" y="28" width="15" height="15" rx="4"/><rect x="9" y="32" width="7" height="7" rx="1"/><path d="M28 28h7v7h-7zM39 28h4v5h-4M28 40h7M40 38v5"/>',
qrheart:'<rect x="4" y="4" width="15" height="15" rx="2"/><rect x="29" y="4" width="15" height="15" rx="2"/><rect x="4" y="29" width="15" height="15" rx="2"/><path d="M8 8h7v7H8zM33 8h7v7h-7zM8 33h7v7H8zM29 31c2-4 7-2 7 1 0-3 6-5 8-1 2 5-8 12-8 12s-10-7-7-12z"/>'};
const groups=[{id:'top',title:'トップス',choices:[['shirt','Tシャツ型'],['blouse','ブラウス型'],['cardigan','カーディガン型']]},{id:'bottom',title:'ボトムス',choices:[['pants','ロングパンツ型'],['skirt','スカート型'],['shorts','ショートパンツ型']]},{id:'shoes',title:'シューズ',choices:[['heels','パンプス型'],['sneakers','スニーカー型'],['boots','ブーツ型']]},{id:'accessory',title:'アクセ',choices:[['bow','リボン型'],['crown','ティアラ型'],['necklace','ネックレス型']]},{id:'qr',title:'QRコード',choices:[['qr','標準QR型'],['qrrounded','丸角QR型'],['qrheart','ハート入り型']]}];
const key='pricoletta-icon-catalog-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let selected=Object.fromEntries(groups.map(g=>[g.id,g.choices.some(c=>c[0]===saved[g.id])?saved[g.id]:g.choices[0][0]]));function svg(id){return '<svg viewBox="0 0 48 48" aria-hidden="true">'+paths[id]+'</svg>'}function render(){document.getElementById('sections').innerHTML=groups.map(g=>'<section class="card"><h2>'+g.title+'</h2><div class="choices">'+g.choices.map(([id,label])=>'<button type="button" class="choice '+(selected[g.id]===id?'selected':'')+'" data-group="'+g.id+'" data-icon="'+id+'" aria-pressed="'+(selected[g.id]===id)+'">'+svg(id)+'<span>'+label+'</span></button>').join('')+'</div></section>').join('');for(const [el,cls] of [['previewGray','gray'],['previewPink','pink']])document.getElementById(el).innerHTML=groups.map(g=>'<div class="tile '+cls+'">'+svg(selected[g.id])+'<span>'+g.title+'</span></div>').join('');try{localStorage.setItem(key,JSON.stringify(selected))}catch(e){}}document.addEventListener('click',e=>{const b=e.target.closest('[data-icon]');if(b){selected[b.dataset.group]=b.dataset.icon;render()}});document.getElementById('reset').onclick=()=>{selected=Object.fromEntries(groups.map(g=>[g.id,g.choices[0][0]]));render();document.getElementById('notice').textContent='初期状態に戻しました'};document.getElementById('copy').onclick=async()=>{const content='Pricoletta アイコン候補\n'+groups.map(g=>g.title+'：'+g.choices.find(c=>c[0]===selected[g.id])[1]).join('\n')+'\n配色：所持・未選択＝グレー／未所持・選択中＝ピンク';try{await navigator.clipboard.writeText(content);document.getElementById('notice').textContent='選択内容をコピーしました'}catch(e){const t=document.createElement('textarea');t.value=content;document.body.append(t);t.select();document.execCommand('copy');t.remove();document.getElementById('notice').textContent='選択内容をコピーしました'}};render();
</script></body></html>

function bkHtml(){var q=S.q,l=sortList(S.outs.filter(function(o){return (!S.bk||o.bookId==S.bk)&&(!q||(o.name+' '+o.memo).indexOf(q)>-1)}),S.bs);if(!l.length)return '<div class="empty">保存したコーデはまだありません。「きせかえ」で作って「決定」を押しましょう。</div>';return '<p>'+l.length+'件のコーデ</p>'+l.map(function(o){var miss=0,ln=[0,1].map(function(i){return 'ATBOS'.split('').filter(function(t){return o.eq[i][t]}).map(function(t){var r=o.eq[i][t],x=pr(r);if(x&&!x.p.own)miss++;return sline(r)})});return '<div class="set '+(miss?'':'done')+'"><div class="hd"><div class="nm">'+esc(o.name)+'<small>'+esc(o.memo||'')+'</small></div><span class="prog">'+(miss?'あと'+miss+'個':'全部持ってる')+'</span></div>'+[0,1].map(function(i){return ln[i].length?'<div style="font-size:12px;margin-bottom:4px"><b>'+SDN[i]+'</b> '+ln[i].map(esc).join(' / ')+'</div>':''}).join('')+'<div class="row" style="flex-wrap:wrap;margin-top:8px"><button class="chip" onclick="loadOut('+o.id+')">開く</button><button class="chip" onclick="qrOut('+o.id+')">QR</button><button class="chip" onclick="moveOut('+o.id+')">移動</button><button class="chip" onclick="memoOut('+o.id+')">メモ</button><button class="chip" onclick="delOut('+o.id+')">削除</button></div></div>'}).join('')}
function outById(id){return S.outs.filter(function(o){return o.id==id})[0]}
function loadOut(id){S.eq=JSON.parse(JSON.stringify(outById(id).eq));S.hist=[];S.fut=[];S.tab='dress';S.q='';render()}
function qrOut(id){var o=outById(id),seq=[];[0,1].forEach(function(i){'ATBOS'.split('').forEach(function(t){var x=o.eq[i][t]&&pr(o.eq[i][t]);if(x&&x.p.qr)seq.push([x.s.id,x.k])})});if(!seq.length){toast('QRが登録されたパーツがありません');return}S.qr={seq:seq,i:0};ov()}
function memoOut(id){var o=outById(id),m=prompt('メモを入力してください',o.memo||'');if(m===null)return;o.memo=m;save2();bl()}
function delOut(id){if(!confirm('このコーデを削除しますか?'))return;S.outs=S.outs.filter(function(o){return o.id!=id});save2();bl()}
function moveOut(id){if(!S.books.length){toast('先に「＋ 新規作成」でブックを作ってください');return}var m='移動先の番号を入力\n0: ブックなし';S.books.forEach(function(b,k){m+='\n'+(k+1)+': '+b.name});var v=parseInt(prompt(m),10);if(isNaN(v)||v<0||v>S.books.length)return;outById(id).bookId=v?S.books[v-1].id:0;save2();render()}
function newBook(){var n=prompt('コーデブックの名前を入力してください');if(!n)return;var id=Date.now();S.books.push({id:id,name:n});S.bk=id;save2();render()}
function curBook(){return S.books.filter(function(b){return b.id==S.bk})[0]}
function renameBook(){var b=curBook(),n=prompt('新しい名前',b.name);if(!n)return;b.name=n;save2();render()}
function delBook(){var b=curBook();if(!confirm('「'+b.name+'」を削除しますか?中のコーデは「すべて」に残ります。'))return;S.outs.forEach(function(o){if(o.bookId==b.id)o.bookId=0});S.books=S.books.filter(function(x){return x.id!=b.id});S.bk=0;save2();render()}
var DB;
function idb(cb){if(DB)return cb(DB);try{var r=indexedDB.open('aipri-img',1);r.onupgradeneeded=function(){r.result.createObjectStore('i')};r.onsuccess=function(){DB=r.result;cb(DB)};r.onerror=function(){cb(null)}}catch(e){cb(null)}}
function imgPut(k,v){idb(function(db){if(db)db.transaction('i','readwrite').objectStore('i').put(v,k)})}
function imgLoad(){idb(function(db){if(!db)return;var q=db.transaction('i').objectStore('i').openCursor();q.onsuccess=function(){var c=q.result;if(c){S.img[c.key]=c.value;c.continue()}else render()}})}
function th(s){return S.img[s.key]?'<img class="th" src="'+S.img[s.key]+'" alt="">':''}
function bulkImg(el){var fs=[].slice.call(el.files),ok=0,ng=0,i=0,R=document.getElementById('bres'),idx={};
 S.sets.forEach(function(s){if(s.code)idx[s.code.toUpperCase()]=s});
 (function nx(){if(i>=fs.length){R.textContent=ok+'件登録しました。'+ng+'件はコードが一致せずスキップ(コーデ以外の画像など)';toast(ok+'件登録しました');return}
  var f=fs[i++],m=/(OAF?\d-\d{3}|V\d-\d{3})/i.exec(f.name),s=m&&idx[m[1].toUpperCase()];
  if(!s){ng++;return nx()}
  var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var sc=Math.min(1,200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);var u=c.toDataURL('image/jpeg',.8);S.img[s.key]=u;imgPut(s.key,u);ok++;R.textContent=ok+'件登録中…';nx()};im.onerror=function(){ng++;nx()};im.src=fr.result};fr.readAsDataURL(f)})()}
function cnorm(c){var m=/(OAF?\d-\d{3}|V\d-\d{3}|APR\d-\d{3})/i.exec(c);return m?m[1].toUpperCase():String(c).toUpperCase().replace(/_/g,'-')}
function serLabel(s){return /^\d+だん$/.test(s)?'ひみつのアイプリ'+s:s==='スペシャル'?'スペシャルコーデアイテム':s}
function applyCatalog(j,n){var its=j.items;if(!Array.isArray(its))throw 0;
 var rows=its.map(function(i){return{ser:serLabel(i.series),code:cnorm(i.code),name:i.name,pg:i.series_key}}),cc={},nums={};
 rows.forEach(function(r){var k=r.ser+'|'+r.code;cc[k]=(cc[k]||0)+1;var m=/^([A-Z]+\d?)-(\d{3})$/.exec(r.code);if(m){var q=r.ser+'|'+m[1];(nums[q]=nums[q]||[]).push(+m[2])}});
 Object.keys(nums).forEach(function(k){nums[k].sort(function(a,b){return a-b})});
 rows.forEach(function(r){
  var dup=cc[r.ser+'|'+r.code]>1,s=S.sets.filter(function(x){return x.ser==r.ser&&cnorm(x.code||'')==r.code&&(!dup||x.name==r.name)})[0]||S.sets.filter(function(x){return x.ser==r.ser&&!x.code&&x.name==r.name})[0];
  if(s){if(!s.code)s.code=r.code;if(!s.pg)s.pg=r.pg;n.up++;return}
  var cfg='ATBS',m=/^([A-Z]+\d?)-(\d{3})$/.exec(r.code);
  if(m&&m[1].indexOf('OAF')!==0){var a=nums[r.ser+'|'+m[1]],v=+m[2],nx=a.filter(function(x){return x>v})[0],g=nx?nx-v:4;cfg=g>=4?'ATBS':g==3?'OSA':g==2?'TB':'O'}
  S._id=(S._id||Date.now())+1;S.sets.push({id:S._id,key:r.ser+'|'+r.code+'|'+r.name,ser:r.ser,pg:r.pg,g:'',code:r.code,name:r.name,fav:0,memo:'',cfg:cfg,p:mk(cfg)});n.ns++})}
function ensureCfg(){S.sets.forEach(function(s){if(!CFG[s.cfg])CFG[s.cfg]=s.cfg.split('').map(function(t){return T[t]?T[t][0]:t}).join('・')})}
function applyPack(pk,n){if(!pk||!Array.isArray(pk.sets))throw 0;var ser=pk.ser;
 pk.sets.forEach(function(ps){
  var pc=ps.code?cnorm(ps.code):'',cd=S.sets.filter(function(x){return x.ser==ser&&pc&&cnorm(x.code||'')==pc}),s=cd.filter(function(x){return x.name==ps.name})[0]||cd[0]||S.sets.filter(function(x){return x.ser==ser&&!x.code&&x.name==ps.name})[0];
  var cfg=ps.parts.map(function(p){return p.t}).join('');
  if(!s){S._id=(S._id||Date.now())+1;s={id:S._id,key:ser+'|'+ps.code+'|'+ps.name,ser:ser,pg:pk.page,g:ps.g||'',code:ps.code,name:ps.name,fav:0,memo:'',cfg:cfg,p:mk(cfg)};S.sets.push(s);n.ns++}
  else{if(!s.code&&ps.code)s.code=ps.code;if(!s.pg)s.pg=pk.page;if(cfg&&s.cfg!=cfg){var lost=s.p.some(function(p){return cfg.indexOf(p.t)<0&&(p.own||p.qr)});if(lost)n.keep++;else{s.cfg=cfg;s.p=mk(cfg,s.p);n.re++}}n.up++}
  if(ps.img){S.img[s.key]=ps.img;imgPut(s.key,ps.img);n.img++}
  ps.parts.forEach(function(p){if(p.img){var k=s.key+'#'+p.t;S.img[k]=p.img;imgPut(k,p.img);n.img++}})})}
function packImport(el){var fs=[].slice.call(el.files),R=document.getElementById('pres'),n={ns:0,up:0,img:0,re:0,keep:0,bad:0},i=0;
 (function nx(){if(i>=fs.length){save();ensureCfg();R.textContent=n.img+'枚の画像を登録、新しいコーデ'+n.ns+'件を追加、既存'+n.up+'件に反映'+(n.re?'、パーツ構成を実際に合わせたもの'+n.re+'件':'')+(n.keep?'、所持済みパーツがあり構成を変えなかったもの'+n.keep+'件':'')+(n.bad?'。読めないファイル'+n.bad+'件':'');toast('取り込みました');return}
  R.textContent=(i+1)+'/'+fs.length+' 取り込み中…';var f=fs[i++],fr=new FileReader();fr.onload=function(){try{var j=JSON.parse(fr.result);if(j&&j.format==='outfit-url-catalog-v1')applyCatalog(j,n);else applyPack(j,n)}catch(e){n.bad++}setTimeout(nx,0)};fr.onerror=function(){n.bad++;nx()};fr.readAsText(f)})()}
function vSet(){return '<div class="set"><p style="margin:0 0 8px">コーデ画像パックの取り込み</p><p style="font-size:12px;color:var(--mute);font-weight:400;margin:0 0 8px">PCで作った aipri-pack-◯◯.json、またはコーデ一覧のカタログJSONを選んでください(複数可)。まだ無いコーデは追加され、パックの場合はコーデ画像とパーツ画像も入ります。</p><label class="btn" style="display:block;text-align:center">パックを選ぶ<input type="file" accept=".json,application/json" multiple hidden onchange="packImport(this)"></label><p id="pres" style="font-size:12px;margin:8px 0 0"></p></div><div class="set"><p style="margin:0 0 8px">コーデ画像の一括登録</p><p style="font-size:12px;color:var(--mute);font-weight:400;margin:0 0 8px">PCで公式のコーデアイテムページを「ページを保存」し、できた画像フォルダの中身を選んでください。ファイル名のコード(例:OA4-028)で自動的に割り当てます。</p><label class="btn" style="display:block;text-align:center">画像を選ぶ(複数可)<input type="file" accept="image/*" multiple hidden onchange="bulkImg(this)"></label><p id="bres" style="font-size:12px;margin:8px 0 0"></p></div><div class="set"><p style="margin:0 0 8px">バックアップ(機種変更・ブラウザ変更に備えて)</p><button class="btn" onclick="exp()">データを書き出す</button><textarea id="bk" placeholder="ここに書き出したデータを貼り付けて「読み込む」"></textarea><button class="btn g" onclick="imp()">読み込む(今のデータを置き換え)</button></div><p class="empty" style="font-size:12px">データはこの端末のブラウザに保存されます。サイトのデータを消すと失われるので、時々バックアップしてください。</p>'}
function exp(){var t=document.getElementById('bk');t.value=JSON.stringify({sets:S.sets,books:S.books,outs:S.outs});t.select();try{document.execCommand('copy');toast('コピーしました')}catch(e){toast('テキストを長押ししてコピーしてください')}}
function imp(){try{var d=JSON.parse(document.getElementById('bk').value);var ss=Array.isArray(d)?d:d.sets;if(!Array.isArray(ss)||!ss[0].p)throw 0;if(!confirm('今のデータを置き換えますか?'))return;S.sets=ss;if(!Array.isArray(d)){S.books=d.books||[];S.outs=d.outs||[]}save();save2();toast('読み込みました');go('list')}catch(e){toast('データの形式が正しくありません')}}
render();
</script>

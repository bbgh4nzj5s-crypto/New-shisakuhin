ss="empty" id="empty">画像を追加してね</span></div></div><div class="actions"><button class="back" id="back">‹ ひとつ前にもどる</button><button class="next" id="next">保存先を選ぶ →</button></div></div><footer class="nav"><div><b>⌂</b>ホーム</div><div><b>▦</b>コーデアイテム</div><div class="current"><b>＋</b>登録</div><div><b>♧</b>きせかえ</div><div><b>···</b>その他</div></footer></main><div class="overlay" id="overlay"><div class="modal"><h2>QR設定</h2><label><input type="checkbox" id="registered"> QRを登録済みにする</label><hr style="border:0;border-top:1px solid #f4d3e6"><label><input type="radio" name="common" value="none" checked> 共通QRなし</label><label><input type="radio" name="common" value="full"> フルコーデが共通のQR</label><label id="tbLabel"><input type="radio" name="common" value="tb"> トップス＆ボトムスが共通のQR</label><button class="close" id="close">設定を閉じる</button><p class="hint">共通QRを選ぶと、QR画像を対応するカテゴリにも表示するよ。</p></div></div><div class="toast" id="toast"></div><input id="files" type="file" accept="image/*" multiple hidden><script>
(()=>{'use strict';const icons={アクセ:'♕',トップス:'♧',ボトムス:'♙',シューズ:'♧',ワンピース:'♢'};
const categoryArtwork={

'シューズ':'<path d="M10 34c8 0 11-8 13-17h12c0 13 5 16 15 19 5 2 7 5 7 11v5H8v-9c0-4 0-9 2-9Z"/><path d="M8 46h49M36 34l5-4m-1 8 5-4"/>',
'ワンピース':'<path d="M24 10 16 17l-7 11 12 5 3-6 1 8-13 19h40L39 35l1-8 3 6 12-5-7-11-8-7-5 6h-6Z"/><path d="M25 35h14M29 16q3 5 6 0"/>'};
function itemPlaceholder(n){return `<span class="cat-placeholder"><svg viewBox="0 0 64 64" aria-hidden="true">${categoryArtwork[n]||categoryArtwork['アクセ']}</svg><small>アイテム画像を追加</small></span>`};const palette=[['ピンク','#ed86bb'],['白','#fff'],['赤','#df606b'],['黒','#333138'],['水色','#8fd6ee'],['黄色','#f0d966'],['紫','#ad90d5'],['緑','#81b98d'],['茶色','#a9856f'],['青','#6d8bd5']];let type='separate',cat='アクセ',selected=null,common='none',assets=[],seq=0;const names=()=>type==='dress'?['アクセ','ワンピース','シューズ']:['アクセ','トップス','ボトムス','シューズ'];const state={};function get(n){return state[n]??(state[n]={item:null,qr:null,checked:false,colors:[],manualColors:false})}const $=id=>document.getElementById(id);function notify(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function status(n){let x=get(n);return x.checked?'登録済み':x.item||x.qr||x.colors.length?'QR未登録':'未登録'}function stclass(n){return status(n)==='登録済み'?'done':status(n)==='QR未登録'?'partial':''}function render(){let list=names();$('tabs').style.gridTemplateColumns=`repeat(${list.length},minmax(0,1fr))`;$('tabs').innerHTML=list.map(n=>`<div class="tab"><button data-cat="${n}" class="${n===cat?'active':''}">${icons[n]} ${n}</button><span class="state ${stclass(n)}">${status(n)==='登録済み'?'✓ ':status(n)==='QR未登録'?'! ':'− '}${status(n)}</span></div>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});$('catIcon').textContent=icons[cat];$('catName').textContent=cat;$('activeStatus').textContent=status(cat);$('activeStatus').style.background=status(cat)==='登録済み'?'#e5f6ec':status(cat)==='QR未登録'?'#fff0d6':'#ececef';$('activeStatus').style.color=status(cat)==='登録済み'?'#31825b':status(cat)==='QR未登録'?'#a86a22':'#777';for(let kind of ['item','qr']){const slot=$(kind+'Slot'),id=get(cat)[kind];slot.innerHTML=id?`<img src="${assets.find(a=>a.id===id)?.url||''}" alt="${kind}"><button class="remove" data-remove="${kind}" aria-label="取り外す">×</button>`:kind==='item'?itemPlaceholder(cat):'<span class="qr-placeholder"><svg class="qr-art" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3.3" stroke-linejoin="round"><rect x="9" y="9" width="17" height="17" rx="3"/><rect x="38" y="9" width="17" height="17" rx="3"/><rect x="9" y="38" width="17" height="17" rx="3"/><path d="M38 38h7v7h-7zM51 39v7h5M39 52h6M51 52h5"/></g><g fill="currentColor"><rect x="15" y="15" width="5" height="5" rx="1"/><rect x="44" y="15" width="5" height="5" rx="1"/><rect x="15" y="44" width="5" height="5" rx="1"/></g><path d="M30 5v5m-2-3h5" stroke="#e89ac4" stroke-width="2" stroke-linecap="round"/></svg><small>QR画像を追加</small></span>';slot.onclick=e=>{if(e.target.closest('.remove')){remove(kind);return}if(selected!==null){place(kind)}else notify('下の画像を選んでから枠をタップしてね')};slot.ondragover=e=>{e.preventDefault();slot.classList.add('target')};slot.ondragleave=()=>slot.classList.remove('target');slot.ondrop=e=>{e.preventDefault();slot.classList.remove('target');const id=Number(e.dataTransfer.getData('text/plain'));if(id){selected=id;place(kind)}}}document.querySelectorAll('.remove').forEach(b=>b.onclick=e=>{e.stopPropagation();remove(b.dataset.remove)});$('colors').innerHTML=palette.map(([name,color])=>`<button class="color ${get(cat).colors.includes(name)?'selected':''}" data-color="${name}"><span class="swatch" style="background:${color}"></span>${name}</button>`).join('');document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{let arr=get(cat).colors,n=b.dataset.color;arr.includes(n)?arr.splice(arr.indexOf(n),1):arr.push(n);get(cat).manualColors=true;render()});renderTray();$('registered').checked=get(cat).checked;$('tbLabel').style.display=type==='dress'?'none':'flex';document.querySelector(`input[name=common][value=${common}]`).checked=true}function renderTray(){document.querySelectorAll('.thumb').forEach(x=>x.remove());$('empty').style.display=assets.filter(a=>!a.used).length?'none':'inline';for(let a of assets.filter(a=>!a.used)){const div=document.createElement('div');div.className='thumb'+(a.id===selected?' selected':'');div.draggable=true;div.dataset.assetId=String(a.id);div.innerHTML=`<img alt="追加画像" src="${a.url}"><button class="x" aria-label="画像を削除">×</button>`;div.onclick=e=>{if(e.target.closest('.x')){if(selected===a.id)selected=null;assets=assets.filter(x=>x!==a);URL.revokeObjectURL(a.url);render();return}selected=a.id;renderTray()};div.ondragstart=e=>{selected=a.id;e.dataTransfer.setData('text/plain',String(a.id))};$('tray').appendChild(div)}}async function suggestColors(file){
